name: Build Kodi JJS 21.3 ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/21.3-jjs-012-android

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      KODI_REPO: https://github.com/jjs-hamburg/kodi-jjs.git
      KODI_REF: release/jjs012-movie-list-bulk
      EXPECTED_KODI_COMMIT: 9aa3022343e956353a2eb5beab676036bd35b9df
      EXPECTED_INTERNAL_APP_NAME: Kodi
      SOURCE_DISPLAY_NAME: Kodi JJS
      SOURCE_PACKAGE: org.jjs.kodi
      EXPECTED_DISPLAY_NAME: Kodi JJS
      EXPECTED_PACKAGE: org.jjs.kodi
      EXPECTED_VERSION_CODE: "2103000"
      EXPECTED_VERSION_NAME: "21.3-JJS.012"
      JJS_BUILD: "012"
      JJS_VERSION_TAG: "JJS.012"
      JJS_ARTIFACT_NAME: Kodi-JJS-21.3-JJS.012-arm64
      EXPECTED_SIGNING_CERT_SHA256: caddfcba2d9ad9b880d410a048dd19c5212e2994669f226724250439a20840c6
      ANDROID_NDK_VERSION: 21.4.7075529
      ANDROID_BUILD_TOOLS_VERSION: 33.0.1
      KODI_DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      KODI_TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      KODI_BUILD: ${{ github.workspace }}/kodi-build

    steps:
      - name: Checkout build wrapper
        uses: actions/checkout@v5

      - name: Check JJS signing secrets
        shell: bash
        env:
          JJS_KEYSTORE_B64: ${{ secrets.JJS_ANDROID_KEYSTORE_B64 }}
          JJS_STORE_PASS: ${{ secrets.JJS_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${JJS_KEYSTORE_B64}"
          test -n "${JJS_STORE_PASS}"

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/share/boost || true
          sudo rm -rf "${ANDROID_SDK_ROOT}/ndk"/* || true
          sudo rm -rf "${ANDROID_SDK_ROOT}/build-tools"/* || true
          sudo rm -rf "${ANDROID_SDK_ROOT}/platforms"/* || true
          sudo apt-get clean
          df -h /

      - name: Install host build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf bison build-essential curl flex gawk git gperf \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev unzip zip zlib1g-dev \
            ccache openjdk-17-jdk-headless

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Cache Kodi dependency downloads and compiled depends
        uses: actions/cache@v5
        with:
          path: |
            android-tools/xbmc-tarballs
            android-tools/xbmc-depends
          key: kodi-21.3-arm64-depends-r21e-v1

      - name: Seed verified build source archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${KODI_TARBALLS}"

          fetch_verified() {
            local name="$1"
            local url="$2"
            local sha512="$3"
            local target="${KODI_TARBALLS}/${name}"
            rm -f "${target}" "${target}.sha512"
            curl --http1.1 --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --output "${target}" "${url}"
            printf '%s  %s\n' "${sha512}" "${target}" | sha512sum --check --strict
          }

          fetch_verified \
            "fontconfig-2.14.0.tar.xz" \
            "https://gstreamer.freedesktop.org/src/mirror/fontconfig-2.14.0.tar.xz" \
            "a5257249d031b3cd1a7b1521cd58f48d235a970020da4136a727db5407ec98e74a3776bc467d7e39f30ec664f56ff9fe39068317744a5e737a65109f7a005bfc"

          fetch_verified \
            "apache-groovy-binary-4.0.26.zip" \
            "https://archive.apache.org/dist/groovy/4.0.26/distribution/apache-groovy-binary-4.0.26.zip" \
            "60d1aea85008a438a9498178dc2137385653f1ea294e7e257959e9e0f94382e160e217e1090047c2a944e328cf46e8ebcfc4b015f7d0cb9f2fcf9d880c6c1344"

          fetch_verified \
            "commons-lang3-3.17.0-bin.tar.gz" \
            "https://archive.apache.org/dist/commons/lang/binaries/commons-lang3-3.17.0-bin.tar.gz" \
            "8927a406a1bd084b548f89cf15fe4bc7567dcaa50ae8abae54e9c883c1574c648fcc8ad6c3abaa381dfbdf1801727ac5e6c4572063203a1dfac293d122282f05"

          fetch_verified \
            "commons-text-1.13.0-bin.tar.gz" \
            "https://archive.apache.org/dist/commons/text/binaries/commons-text-1.13.0-bin.tar.gz" \
            "a51667463e88b2d017c3baebb9bbe42c4e50cba96ffe19c89680e82002a4db8b9007daff75f8dbf8bf3725be13a3f03f3c2bc4e1f11e8e02dcab4408abdb44a1"

      - name: Fetch pinned Kodi JJS source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --branch "${KODI_REF}" --depth 1 "${KODI_REPO}" kodi
          ACTUAL_COMMIT="$(git -C kodi rev-parse HEAD)"
          echo "Kodi JJS source: ${ACTUAL_COMMIT}"
          test "${ACTUAL_COMMIT}" = "${EXPECTED_KODI_COMMIT}"
          grep -qx "APP_NAME ${EXPECTED_INTERNAL_APP_NAME}" kodi/version.txt
          grep -qx "VERSION_TAG ${JJS_VERSION_TAG}" kodi/version.txt
          grep -qx "APP_PACKAGE ${SOURCE_PACKAGE}" kodi/version.txt
          grep -Fq "<string name=\"app_name\">${SOURCE_DISPLAY_NAME}</string>" \
            kodi/tools/android/packaging/xbmc/strings.xml.in
          git -C kodi diff --check
          test -z "$(git -C kodi status --porcelain)"

      - name: Verify pristine JJS.012 source tree
        shell: bash
        run: |
          set -euxo pipefail
          git -C kodi diff --check
          test -z "$(git -C kodi status --porcelain)"
          grep -qx "APP_PACKAGE ${EXPECTED_PACKAGE}" kodi/version.txt
          grep -Fq "<string name=\"app_name\">${EXPECTED_DISPLAY_NAME}</string>" \
            kodi/tools/android/packaging/xbmc/strings.xml.in

      - name: Apply JJS.012 movie-list bulk preload test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("kodi/xbmc/video/VideoDatabase.cpp")
          text = path.read_text()
          start = text.index("bool CVideoDatabase::GetMoviesByWhere(")
          end = text.index("\nbool CVideoDatabase::GetTvShowsNav(", start)
          section = text[start:end]
          needle = """    // cleanup
              m_pDS->close();
              return true;
          """
          if section.count(needle) != 1:
              raise SystemExit("JJS.012 patch anchor not found exactly once")

          replacement = r'''    // cleanup the main movie query before the bulk preload queries
              m_pDS->close();

              // JJS.012: Native movie title lists already have idMovie/idFile/idSet for every item.
              // Preload stream details and library artwork in bulk so CVideoThumbLoader does not
              // perform one database query per movie. This stays inside CVideoDatabase and therefore
              // uses the same SQLite/MySQL/MariaDB abstraction as the normal video library.
              if (StringUtils::StartsWith(strBaseDir, "videodb://movies/titles/") && m_pDS2)
              {
                const auto bulkStart = std::chrono::steady_clock::now();
                std::map<int, CFileItemPtr> itemsByFile;
                std::map<int, CFileItemPtr> itemsByMovie;
                for (const auto& item : items)
                {
                  if (!item || !item->HasVideoInfoTag())
                    continue;
                  CVideoInfoTag* tag = item->GetVideoInfoTag();
                  if (tag->m_iFileId >= 0)
                    itemsByFile[tag->m_iFileId] = item;
                  if (tag->m_iDbId >= 0)
                    itemsByMovie[tag->m_iDbId] = item;
                }

                const std::string selectedMoviesSQL =
                    "SELECT movie_view.idMovie, movie_view.idFile, movie_view.idSet FROM movie_view " +
                    strSQLExtra;

                size_t streamRows = 0;
                size_t streamFiles = 0;
                bool streamQueryOk = true;
                const auto streamStart = std::chrono::steady_clock::now();

                if (!(getDetails & VideoDbDetailsStream))
                {
                  std::set<int> loadedStreamFiles;
                  const std::string streamSQL =
                      "SELECT DISTINCT streamdetails.* FROM streamdetails JOIN (" + selectedMoviesSQL +
                      ") AS selected_movies ON selected_movies.idFile = streamdetails.idFile";
                  streamQueryOk = m_pDS2->query(streamSQL);
                  if (streamQueryOk)
                  {
                    while (!m_pDS2->eof())
                    {
                      const int fileId = m_pDS2->fv(0).get_asInt();
                      const auto itemIt = itemsByFile.find(fileId);
                      if (itemIt != itemsByFile.end())
                      {
                        CVideoInfoTag* tag = itemIt->second->GetVideoInfoTag();
                        CStreamDetails& details = tag->m_streamDetails;
                        if (loadedStreamFiles.insert(fileId).second)
                          details.Reset();

                        const CStreamDetail::StreamType streamType =
                            static_cast<CStreamDetail::StreamType>(m_pDS2->fv(1).get_asInt());
                        switch (streamType)
                        {
                          case CStreamDetail::VIDEO:
                          {
                            CStreamDetailVideo* p = new CStreamDetailVideo();
                            p->m_strCodec = m_pDS2->fv(2).get_asString();
                            p->m_fAspect = m_pDS2->fv(3).get_asFloat();
                            p->m_iWidth = m_pDS2->fv(4).get_asInt();
                            p->m_iHeight = m_pDS2->fv(5).get_asInt();
                            p->m_iDuration = m_pDS2->fv(10).get_asInt();
                            p->m_strStereoMode = m_pDS2->fv(11).get_asString();
                            p->m_strLanguage = m_pDS2->fv(12).get_asString();
                            p->m_strHdrType = m_pDS2->fv(13).get_asString();
                            details.AddStream(p);
                            break;
                          }
                          case CStreamDetail::AUDIO:
                          {
                            CStreamDetailAudio* p = new CStreamDetailAudio();
                            p->m_strCodec = m_pDS2->fv(6).get_asString();
                            p->m_iChannels = m_pDS2->fv(7).get_isNull()
                                                   ? -1
                                                   : m_pDS2->fv(7).get_asInt();
                            p->m_strLanguage = m_pDS2->fv(8).get_asString();
                            details.AddStream(p);
                            break;
                          }
                          case CStreamDetail::SUBTITLE:
                          {
                            CStreamDetailSubtitle* p = new CStreamDetailSubtitle();
                            p->m_strLanguage = m_pDS2->fv(9).get_asString();
                            details.AddStream(p);
                            break;
                          }
                          default:
                            break;
                        }
                        ++streamRows;
                      }
                      m_pDS2->next();
                    }
                    m_pDS2->close();

                    for (const int fileId : loadedStreamFiles)
                    {
                      const auto itemIt = itemsByFile.find(fileId);
                      if (itemIt == itemsByFile.end())
                        continue;
                      CVideoInfoTag* tag = itemIt->second->GetVideoInfoTag();
                      CStreamDetails& details = tag->m_streamDetails;
                      details.DetermineBestStreams();
                      if (details.GetVideoDuration() > 0)
                        tag->SetDuration(details.GetVideoDuration());
                    }
                    streamFiles = loadedStreamFiles.size();
                  }
                  else
                  {
                    m_pDS2->close();
                  }
                }

                const auto streamEnd = std::chrono::steady_clock::now();
                CLog::Log(LOGINFO,
                          "[JJS.012 movie bulk] streams: rows={}, files={}, ok={}, {} ms",
                          streamRows, streamFiles, streamQueryOk,
                          std::chrono::duration_cast<std::chrono::milliseconds>(streamEnd - streamStart)
                              .count());

                size_t movieArtRows = 0;
                bool movieArtOk = false;
                const auto movieArtStart = std::chrono::steady_clock::now();
                const std::string movieArtSQL =
                    "SELECT DISTINCT selected_movies.idMovie, art.type, art.url FROM art JOIN (" +
                    selectedMoviesSQL +
                    ") AS selected_movies ON art.media_id = selected_movies.idMovie "
                    "WHERE art.media_type = 'movie'";
                movieArtOk = m_pDS2->query(movieArtSQL);
                if (movieArtOk)
                {
                  while (!m_pDS2->eof())
                  {
                    const int movieId = m_pDS2->fv(0).get_asInt();
                    const auto itemIt = itemsByMovie.find(movieId);
                    if (itemIt != itemsByMovie.end())
                    {
                      itemIt->second->SetArt(m_pDS2->fv(1).get_asString(),
                                             m_pDS2->fv(2).get_asString());
                      ++movieArtRows;
                    }
                    m_pDS2->next();
                  }
                  m_pDS2->close();
                }
                else
                {
                  m_pDS2->close();
                }
                const auto movieArtEnd = std::chrono::steady_clock::now();
                CLog::Log(LOGINFO,
                          "[JJS.012 movie bulk] movie art: rows={}, ok={}, {} ms", movieArtRows,
                          movieArtOk,
                          std::chrono::duration_cast<std::chrono::milliseconds>(movieArtEnd - movieArtStart)
                              .count());

                size_t setArtRows = 0;
                bool setArtOk = false;
                const auto setArtStart = std::chrono::steady_clock::now();
                const std::string setArtSQL =
                    "SELECT DISTINCT selected_movies.idMovie, art.type, art.url FROM art JOIN (" +
                    selectedMoviesSQL +
                    ") AS selected_movies ON art.media_id = selected_movies.idSet "
                    "WHERE art.media_type = 'set'";
                setArtOk = m_pDS2->query(setArtSQL);
                if (setArtOk)
                {
                  while (!m_pDS2->eof())
                  {
                    const int movieId = m_pDS2->fv(0).get_asInt();
                    const auto itemIt = itemsByMovie.find(movieId);
                    if (itemIt != itemsByMovie.end())
                    {
                      itemIt->second->SetArt("set." + m_pDS2->fv(1).get_asString(),
                                             m_pDS2->fv(2).get_asString());
                      ++setArtRows;
                    }
                    m_pDS2->next();
                  }
                  m_pDS2->close();
                }
                else
                {
                  m_pDS2->close();
                }
                const auto setArtEnd = std::chrono::steady_clock::now();
                CLog::Log(LOGINFO,
                          "[JJS.012 movie bulk] set art: rows={}, ok={}, {} ms", setArtRows,
                          setArtOk,
                          std::chrono::duration_cast<std::chrono::milliseconds>(setArtEnd - setArtStart)
                              .count());

                if (movieArtOk && setArtOk)
                {
                  for (const auto& item : items)
                  {
                    if (item && item->HasVideoInfoTag())
                      item->SetProperty("libraryartfilled", true);
                  }
                }

                const auto bulkEnd = std::chrono::steady_clock::now();
                CLog::Log(LOGINFO,
                          "[JJS.012 movie bulk] complete: items={}, {} ms", items.Size(),
                          std::chrono::duration_cast<std::chrono::milliseconds>(bulkEnd - bulkStart)
                              .count());
              }

              return true;
          '''
          section = section.replace(needle, replacement)
          path.write_text(text[:start] + section + text[end:])
          PY

          git -C kodi diff --check
          grep -Fq "[JJS.012 movie bulk] complete" kodi/xbmc/video/VideoDatabase.cpp
          git -C kodi diff --stat

      - name: Configure Kodi Android ARM64 depends
        working-directory: kodi/tools/depends
        run: |
          set -euxo pipefail
          mkdir -p "${KODI_TARBALLS}" "${KODI_DEPENDS}"
          ./bootstrap
          ./configure \
            --with-tarballs="${KODI_TARBALLS}" \
            --host=aarch64-linux-android \
            --with-sdk-path="${ANDROID_SDK_ROOT}" \
            --with-ndk-path="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" \
            --prefix="${KODI_DEPENDS}" \
            --disable-debug

      - name: Build Kodi depends
        working-directory: kodi/tools/depends
        run: |
          set -euxo pipefail
          make -j"$(nproc)"

      - name: Generate Kodi build tree
        working-directory: kodi
        run: |
          set -euxo pipefail
          mkdir -p "${KODI_BUILD}"
          make -C tools/depends/target/cmakebuildsys BUILD_DIR="${KODI_BUILD}"

      - name: Build Kodi JJS
        working-directory: kodi-build
        run: |
          set -euxo pipefail
          make -j"$(nproc)"

      - name: Free packaging headroom
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "${KODI_TARBALLS}"
          rm -rf "${HOME}/.ccache" "${HOME}/.cache/pip" || true
          sudo apt-get clean
          df -h /

      - name: Build signed Kodi JJS APK
        working-directory: kodi-build
        shell: bash
        env:
          JJS_KEYSTORE_B64: ${{ secrets.JJS_ANDROID_KEYSTORE_B64 }}
          JJS_STORE_PASS: ${{ secrets.JJS_ANDROID_KEYSTORE_PASSWORD }}
          JJS_KEY_PASS_SECRET: ${{ secrets.JJS_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/signing"
          KEYSTORE="${GITHUB_WORKSPACE}/signing/jjs-kodi.keystore"
          printf '%s' "${JJS_KEYSTORE_B64}" | base64 --decode > "${KEYSTORE}"
          chmod 600 "${KEYSTORE}"

          export LANG=C
          KEY_ALIAS="$(keytool -list \
            -keystore "${KEYSTORE}" \
            -storepass "${JJS_STORE_PASS}" 2>/dev/null \
            | awk -F, '/PrivateKeyEntry/{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit}')"
          test -n "${KEY_ALIAS}"

          JJS_KEY_PASS="${JJS_KEY_PASS_SECRET:-${JJS_STORE_PASS}}"
          export KODI_ANDROID_STORE_FILE="${KEYSTORE}"
          export KODI_ANDROID_STORE_PASSWORD="${JJS_STORE_PASS}"
          export KODI_ANDROID_KEY_ALIAS="${KEY_ALIAS}"
          export KODI_ANDROID_KEY_PASSWORD="${JJS_KEY_PASS}"

          make apk
          df -h /

      - name: Verify and collect installable APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}"
          AAPT="${BUILD_TOOLS}/aapt"
          APKSIGNER="${BUILD_TOOLS}/apksigner"

          mkdir -p artifact
          APK="$(find "${GITHUB_WORKSPACE}/kodi" "${KODI_BUILD}" -type f -name '*.apk' -printf '%T@ %p\n' \
            | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "${APK}"

          "${AAPT}" dump badging "${APK}" | tee artifact/AAPT-BADGING.txt
          grep -q "package: name='${EXPECTED_PACKAGE}'" artifact/AAPT-BADGING.txt
          grep -q "versionCode='${EXPECTED_VERSION_CODE}'" artifact/AAPT-BADGING.txt
          grep -q "versionName='${EXPECTED_VERSION_NAME}'" artifact/AAPT-BADGING.txt
          grep -q "application-label:'${EXPECTED_DISPLAY_NAME}'" artifact/AAPT-BADGING.txt

          "${APKSIGNER}" verify --verbose --print-certs "${APK}" \
            | tee artifact/APKSIGNER-VERIFY.txt
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' artifact/APKSIGNER-VERIFY.txt \
            | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "${CERT_SHA256}" = "${EXPECTED_SIGNING_CERT_SHA256}"

          unzip -Z1 "${APK}" | grep -q '^lib/arm64-v8a/libkodi.so$'
          if unzip -Z1 "${APK}" | grep '^lib/' | grep -Ev '^lib/arm64-v8a/' >/dev/null; then
            echo "::error::Unexpected non-arm64 native libraries in APK"
            exit 1
          fi

          SHORT_COMMIT="${EXPECTED_KODI_COMMIT:0:7}"
          APK_BASENAME="Kodi-JJS-${EXPECTED_VERSION_NAME}-${SHORT_COMMIT}-arm64.apk"
          cp "${APK}" "artifact/${APK_BASENAME}"
          APK_SHA256="$(sha256sum "artifact/${APK_BASENAME}" | awk '{print $1}')"
          LIB_SHA256="$(unzip -p "artifact/${APK_BASENAME}" lib/arm64-v8a/libkodi.so | sha256sum | awk '{print $1}')"

          cat > artifact/BUILD-INFO.txt <<EOF
          Kodi repository: ${KODI_REPO}
          Kodi source ref: ${KODI_REF}
          Kodi source commit: ${EXPECTED_KODI_COMMIT}
          Kodi JJS build: ${JJS_BUILD}
          Kodi JJS version tag: ${JJS_VERSION_TAG}
          Android display name: ${EXPECTED_DISPLAY_NAME}
          Android package: ${EXPECTED_PACKAGE}
          Version: ${EXPECTED_VERSION_NAME} (${EXPECTED_VERSION_CODE})
          APK filename: ${APK_BASENAME}
          Target: Android arm64-v8a
          NDK: ${ANDROID_NDK_VERSION}
          Signing certificate SHA256: ${CERT_SHA256}
          APK SHA256: ${APK_SHA256}
          libkodi.so SHA256: ${LIB_SHA256}
          Wrapper commit: ${GITHUB_SHA}
          JJS.012 test: native movie-list bulk streamdetails + movie/set artwork preload
          EOF

          sha256sum "artifact/${APK_BASENAME}" > artifact/SHA256SUMS.txt

      - name: Upload ready-to-install Kodi JJS APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JJS_ARTIFACT_NAME }}
          path: artifact/
          if-no-files-found: error
          retention-days: 90
