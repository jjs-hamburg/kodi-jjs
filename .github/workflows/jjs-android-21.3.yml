          replace_once(
              "xbmc/TextureCache.cpp",
              '''    // cache the texture directly
              CTextureCacheJob job(url);
          ''',
              '''    // cache the texture directly
              if (jjsTrace)
                CLog::Log(LOGINFO, "[JJS-ARTCACHE][CacheImage] DIRECT-CACHE-JOB source='{}'",
                          CURL::GetRedacted(url));
              CTextureCacheJob job(url);
          ''')

          replace_once(
