            if (jjsTrace)
              CLog::Log(LOGINFO, "[JJS-ARTCACHE][Job.GetImageHash] STAT-FAILED '{}''",
                        CURL::GetRedacted(url));
            CLog::Log(LOGDEBUG, "{} - unable to stat url {}", __FUNCTION__, CURL::GetRedacted(url));
            return "";
          }
          ''')

          # ------------------------------------------------------------------
