                   value.find("Beniamino") != std::string::npos ||
                   value.find("Gigli") != std::string::npos;
          }
          } // namespace

          CTextureCacheJob::CTextureCacheJob''')

          replace_once(
              "xbmc/TextureCacheJob.cpp",
              '''bool CTextureCacheJob::DoWork()
          {
            if (ShouldCancel(0, 0))
              return false;

            // check whether we need cache the job anyway
            bool needsRecaching = false;
            std::string path(CServiceBroker::GetTextureCache()->CheckCachedImage(m_url, needsRecaching));
            if (!path.empty() && !needsRecaching)
              return false;
            if (CServiceBroker::GetTextureCache()->StartCacheImage(m_url))
              return CacheTexture();

            return false;
          }
          ''',
              '''bool CTextureCacheJob::DoWork()
          {
            const bool jjsTrace = JjsArtistCacheTrace(m_url);
            if (jjsTrace)
              CLog::Log(LOGINFO, "[JJS-ARTCACHE][Job.DoWork] START source='{}'",
                        CURL::GetRedacted(m_url));

            if (ShouldCancel(0, 0))
              return false;

            // check whether we need cache the job anyway
            bool needsRecaching = false;
            std::string path(CServiceBroker::GetTextureCache()->CheckCachedImage(m_url, needsRecaching));
            if (jjsTrace)
              CLog::Log(LOGINFO,
                        "[JJS-ARTCACHE][Job.DoWork] cachedPath='{}' needsRecaching={}",
                        CURL::GetRedacted(path), needsRecaching);
            if (!path.empty() && !needsRecaching)
            {
              if (jjsTrace)
                CLog::Log(LOGINFO, "[JJS-ARTCACHE][Job.DoWork] STOP-CACHE-VALID");
              return false;
            }
            const bool claimed = CServiceBroker::GetTextureCache()->StartCacheImage(m_url);
            if (jjsTrace)
              CLog::Log(LOGINFO, "[JJS-ARTCACHE][Job.DoWork] processingClaim={}", claimed);
            if (claimed)
              return CacheTexture();

            return false;
          }
          ''')

          start = '''bool CTextureCacheJob::CacheTexture(std::unique_ptr<CTexture>* out_texture)
          {
            // unwrap the URL as required
            std::string additional_info;
            unsigned int width, height;
            CPictureScalingAlgorithm::Algorithm scalingAlgorithm;
            std::string image = DecodeImageURL(m_url, width, height, scalingAlgorithm, additional_info);

            m_details.updateable = ShouldCheckForChanges(additional_info, image);

            if (m_details.updateable)
            {
              // generate the hash
              m_details.hash = GetImageHash(image);
              if (m_details.hash.empty())
                return false;

              if (m_details.hash == m_oldHash)
              {
                m_details.hashRevalidated = true;
                return true;
              }
            }

            std::unique_ptr<CTexture> texture = LoadImage(image, width, height, additional_info, true);
            if (texture)
            {
              if (texture->HasAlpha())
                m_details.file = m_cachePath + ".png";
              else
                m_details.file = m_cachePath + ".jpg";

              CLog::Log(LOGDEBUG, "{} image '{}' to '{}':", m_oldHash.empty() ? "Caching" : "Recaching",
                        CURL::GetRedacted(image), m_details.file);

              if (CPicture::CacheTexture(texture.get(), width, height,
                                         CTextureCache::GetCachedPath(m_details.file), scalingAlgorithm))
              {
                m_details.width = width;
                m_details.height = height;
                if (out_texture) // caller wants the texture
                  *out_texture = std::move(texture);
                return true;
              }
            }
            return false;
          }
          '''
          repl = '''bool CTextureCacheJob::CacheTexture(std::unique_ptr<CTexture>* out_texture)
          {
            // unwrap the URL as required
            std::string additional_info;
            unsigned int width, height;
            CPictureScalingAlgorithm::Algorithm scalingAlgorithm;
            std::string image = DecodeImageURL(m_url, width, height, scalingAlgorithm, additional_info);
            const bool jjsTrace = JjsArtistCacheTrace(m_url) || JjsArtistCacheTrace(image);
            if (jjsTrace)
              CLog::Log(LOGINFO,
                        "[JJS-ARTCACHE][Job.CacheTexture] url='{}' image='{}' oldHash='{}' info='{}'",
                        CURL::GetRedacted(m_url), CURL::GetRedacted(image), m_oldHash, additional_info);

            m_details.updateable = ShouldCheckForChanges(additional_info, image);
            if (jjsTrace)
              CLog::Log(LOGINFO, "[JJS-ARTCACHE][Job.CacheTexture] updateable={}",
                        m_details.updateable);

            if (m_details.updateable)
            {
              // generate the hash
              m_details.hash = GetImageHash(image);
              if (jjsTrace)
                CLog::Log(LOGINFO, "[JJS-ARTCACHE][Job.CacheTexture] sourceHash='{}' oldHash='{}'",
                          m_details.hash, m_oldHash);
              if (m_details.hash.empty())
              {
                if (jjsTrace)
                  CLog::Log(LOGINFO, "[JJS-ARTCACHE][Job.CacheTexture] FAIL-NO-HASH");
                return false;
              }

              if (m_details.hash == m_oldHash)
              {
                m_details.hashRevalidated = true;
                if (jjsTrace)
                  CLog::Log(LOGINFO, "[JJS-ARTCACHE][Job.CacheTexture] REVALIDATED-NO-LOAD");
                return true;
              }
            }

            if (jjsTrace)
              CLog::Log(LOGINFO, "[JJS-ARTCACHE][Job.CacheTexture] SOURCE-LOAD '{}'",
                        CURL::GetRedacted(image));
            std::unique_ptr<CTexture> texture = LoadImage(image, width, height, additional_info, true);
            if (texture)
            {
              if (texture->HasAlpha())
                m_details.file = m_cachePath + ".png";
              else
                m_details.file = m_cachePath + ".jpg";

              CLog::Log(LOGDEBUG, "{} image '{}' to '{}':", m_oldHash.empty() ? "Caching" : "Recaching",
                        CURL::GetRedacted(image), m_details.file);

              if (CPicture::CacheTexture(texture.get(), width, height,
                                         CTextureCache::GetCachedPath(m_details.file), scalingAlgorithm))
              {
                m_details.width = width;
                m_details.height = height;
                if (jjsTrace)
                  CLog::Log(LOGINFO,
                            "[JJS-ARTCACHE][Job.CacheTexture] WROTE-LOCAL file='{}' {}x{}",
                            m_details.file, width, height);
                if (out_texture) // caller wants the texture
                  *out_texture = std::move(texture);
                return true;
              }
            }
            if (jjsTrace)
              CLog::Log(LOGINFO, "[JJS-ARTCACHE][Job.CacheTexture] FAIL-SOURCE-OR-WRITE");
            return false;
          }
          '''
          replace_once("xbmc/TextureCacheJob.cpp", start, repl)

          replace_once(
              "xbmc/TextureCacheJob.cpp",
              '''std::string CTextureCacheJob::GetImageHash(const std::string &url)
          {
            // silently ignore - we cannot stat these
            // in the case of upnp thumbs are/should be provided when filling the directory list, there's no reason to stat all object ids
            if (URIUtils::IsProtocol(url, "addons") || URIUtils::IsProtocol(url, "plugin") ||
                URIUtils::IsProtocol(url, "upnp"))
              return "";

            struct __stat64 st;
            if (XFILE::CFile::Stat(url, &st) == 0)
            {
              int64_t time = st.st_mtime;
              if (!time)
                time = st.st_ctime;
              if (time || st.st_size)
                return StringUtils::Format("d{}s{}", time, st.st_size);

              // the image exists but we couldn't determine the mtime/ctime and/or size
              // so set an obviously bad hash
              return "BADHASH";
            }

            CLog::Log(LOGDEBUG, "{} - unable to stat url {}", __FUNCTION__, CURL::GetRedacted(url));
            return "";
          }
          ''',
