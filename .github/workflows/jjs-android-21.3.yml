            if (JjsArtistCacheTrace(job->m_url))
              CLog::Log(LOGINFO,
                        "[JJS-ARTCACHE][OnCachingComplete] success={} source='{}' file='{}' hash='{}' updateable={} revalidated={}",
                        success, CURL::GetRedacted(job->m_url), job->m_details.file,
                        job->m_details.hash, job->m_details.updateable, job->m_details.hashRevalidated);
            if (success)
          ''')

