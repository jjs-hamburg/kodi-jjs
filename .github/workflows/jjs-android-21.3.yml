            if (URIUtils::IsProtocol(url, "addons") || URIUtils::IsProtocol(url, "plugin") ||
                URIUtils::IsProtocol(url, "upnp"))
              return "";

            struct __stat64 st;
            if (XFILE::CFile::Stat(url, &st) == 0)
            {
              int64_t time = st.st_mtime;
              if (!time)
                time = st.st_ctime;
              if (time || st.st_size)
              {
                const std::string hash = StringUtils::Format("d{}s{}", time, st.st_size);
                if (jjsTrace)
                  CLog::Log(LOGINFO,
