name: Build Kodi JJS 21.3 ARTIST CACHE DIAG ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/diag-jjs008-artist-cache-android

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      KODI_REPO: https://github.com/jjs-hamburg/kodi-jjs.git
      KODI_REF: test/jjs008-android-tv-banner
      EXPECTED_KODI_COMMIT: 552c6714e0078ea394ab3cc869ab1d0f4f8f70b4
      EXPECTED_INTERNAL_APP_NAME: Kodi
      SOURCE_DISPLAY_NAME: Kodi JJS
      SOURCE_PACKAGE: org.jjs.kodi
      EXPECTED_DISPLAY_NAME: Kodi JJS
      EXPECTED_PACKAGE: org.jjs.kodi
      EXPECTED_VERSION_CODE: "2103000"
      EXPECTED_VERSION_NAME: "21.3-JJS.008"
      JJS_BUILD: "008"
      JJS_VERSION_TAG: "JJS.008"
      JJS_ARTIFACT_NAME: Kodi-JJS-21.3-JJS.008-ARTCACHE-DIAG-arm64
      EXPECTED_SIGNING_CERT_SHA256: caddfcba2d9ad9b880d410a048dd19c5212e2994669f226724250439a20840c6
      ANDROID_NDK_VERSION: 21.4.7075529
      ANDROID_BUILD_TOOLS_VERSION: 33.0.1
      KODI_DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      KODI_TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      KODI_BUILD: ${{ github.workspace }}/kodi-build

    steps:
      - name: Checkout build wrapper
        uses: actions/checkout@v5

      - name: Check JJS signing secrets
        shell: bash
        env:
          JJS_KEYSTORE_B64: ${{ secrets.JJS_ANDROID_KEYSTORE_B64 }}
          JJS_STORE_PASS: ${{ secrets.JJS_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${JJS_KEYSTORE_B64}"
          test -n "${JJS_STORE_PASS}"

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/share/boost || true
          sudo rm -rf "${ANDROID_SDK_ROOT}/ndk"/* || true
          sudo rm -rf "${ANDROID_SDK_ROOT}/build-tools"/* || true
          sudo rm -rf "${ANDROID_SDK_ROOT}/platforms"/* || true
          sudo apt-get clean
          df -h /

      - name: Install host build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf bison build-essential curl flex gawk git gperf \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev unzip zip zlib1g-dev \
            ccache openjdk-17-jdk-headless

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Cache Kodi dependency downloads and compiled depends
        uses: actions/cache@v5
        with:
          path: |
            android-tools/xbmc-tarballs
            android-tools/xbmc-depends
          key: kodi-21.3-arm64-depends-r21e-v1

      - name: Fetch pinned Kodi JJS.008 production source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --branch "${KODI_REF}" --depth 1 "${KODI_REPO}" kodi
          ACTUAL_COMMIT="$(git -C kodi rev-parse HEAD)"
          echo "Kodi JJS source: ${ACTUAL_COMMIT}"
          test "${ACTUAL_COMMIT}" = "${EXPECTED_KODI_COMMIT}"
          grep -qx "APP_NAME ${EXPECTED_INTERNAL_APP_NAME}" kodi/version.txt
          grep -qx "VERSION_TAG ${JJS_VERSION_TAG}" kodi/version.txt
          grep -qx "APP_PACKAGE ${SOURCE_PACKAGE}" kodi/version.txt
          grep -Fq "<string name=\"app_name\">${SOURCE_DISPLAY_NAME}</string>" \
            kodi/tools/android/packaging/xbmc/strings.xml.in
          git -C kodi diff --check
          test -z "$(git -C kodi status --porcelain)"

      - name: Inject targeted artist texture-cache diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path("kodi")

          def replace_once(rel, old, new):
              path = root / rel
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{rel}: expected exactly one anchor, got {count}")
              path.write_text(text.replace(old, new, 1))

          # ------------------------------------------------------------------
          # xbmc/TextureCache.cpp
          # ------------------------------------------------------------------
          replace_once(
              "xbmc/TextureCache.cpp",
              "using namespace XFILE;\nusing namespace std::chrono_literals;\n\nCTextureCache::CTextureCache()",
              "using namespace XFILE;\nusing namespace std::chrono_literals;\n\n"
              "namespace\n{\n"
              "bool JjsArtistCacheTrace(const std::string& value)\n"
              "{\n"
              "  return value.find(\"Bert\") != std::string::npos ||\n"
              "         value.find(\"Kaempfert\") != std::string::npos ||\n"
              "         value.find(\"Beniamino\") != std::string::npos ||\n"
              "         value.find(\"Gigli\") != std::string::npos;\n"
              "}\n"
              "} // namespace\n\n"
              "CTextureCache::CTextureCache()"
          )

          replace_once(
              "xbmc/TextureCache.cpp",
              '''std::string CTextureCache::GetCachedImage(const std::string &image, CTextureDetails &details, bool trackUsage)
          {
            std::string url = CTextureUtils::UnwrapImageURL(image);
            if (url.empty())
              return "";
            if (IsCachedImage(url))
              return url;

            // lookup the item in the database
            if (GetCachedTexture(url, details))
            {
              if (details.file.empty())
                return {};

              if (trackUsage)
                IncrementUseCount(details);
              return GetCachedPath(details.file);
            }
            return "";
          }
          ''',
              '''std::string CTextureCache::GetCachedImage(const std::string &image, CTextureDetails &details, bool trackUsage)
          {
            std::string url = CTextureUtils::UnwrapImageURL(image);
            const bool jjsTrace = JjsArtistCacheTrace(image) || JjsArtistCacheTrace(url);
            if (jjsTrace)
              CLog::Log(LOGINFO, "[JJS-ARTCACHE][GetCachedImage] request='{}' unwrapped='{}' trackUsage={}",
                        CURL::GetRedacted(image), CURL::GetRedacted(url), trackUsage);

            if (url.empty())
              return "";
            if (IsCachedImage(url))
            {
              if (jjsTrace)
                CLog::Log(LOGINFO, "[JJS-ARTCACHE][GetCachedImage] ALREADY-CACHED-PATH '{}'",
                          CURL::GetRedacted(url));
              return url;
            }

            // lookup the item in the database
            const bool dbHit = GetCachedTexture(url, details);
            if (jjsTrace)
              CLog::Log(LOGINFO,
                        "[JJS-ARTCACHE][GetCachedImage] DB-HIT={} file='{}' hash='{}'",
                        dbHit, details.file, details.hash);
            if (dbHit)
            {
              if (details.file.empty())
                return {};

              if (trackUsage)
                IncrementUseCount(details);
              const std::string cachedPath = GetCachedPath(details.file);
              if (jjsTrace)
                CLog::Log(LOGINFO, "[JJS-ARTCACHE][GetCachedImage] RETURN-LOCAL '{}'",
                          CURL::GetRedacted(cachedPath));
              return cachedPath;
            }
            if (jjsTrace)
              CLog::Log(LOGINFO, "[JJS-ARTCACHE][GetCachedImage] CACHE-MISS");
            return "";
          }
          ''')

          replace_once(
              "xbmc/TextureCache.cpp",
              '''void CTextureCache::BackgroundCacheImage(const std::string &url)
          {
            if (url.empty())
              return;

            CTextureDetails details;
            std::string path(GetCachedImage(url, details));
            if (!path.empty() && details.hash.empty())
              return; // image is already cached and doesn't need to be checked further

            path = CTextureUtils::UnwrapImageURL(url);
            if (path.empty())
              return;

            // needs (re)caching
            AddJob(new CTextureCacheJob(path, details.hash));
          }
          ''',
              '''void CTextureCache::BackgroundCacheImage(const std::string &url)
          {
            if (url.empty())
              return;

            const bool jjsTrace = JjsArtistCacheTrace(url);
            CTextureDetails details;
            std::string path(GetCachedImage(url, details));
            if (jjsTrace)
              CLog::Log(LOGINFO,
                        "[JJS-ARTCACHE][BackgroundCacheImage] lookup path='{}' hash='{}'",
                        CURL::GetRedacted(path), details.hash);
            if (!path.empty() && details.hash.empty())
            {
              if (jjsTrace)
                CLog::Log(LOGINFO, "[JJS-ARTCACHE][BackgroundCacheImage] STOP-LOCAL-CACHE-VALID");
              return; // image is already cached and doesn't need to be checked further
            }

            path = CTextureUtils::UnwrapImageURL(url);
            if (path.empty())
              return;

            if (jjsTrace)
              CLog::Log(LOGINFO,
                        "[JJS-ARTCACHE][BackgroundCacheImage] QUEUE-CACHE-JOB source='{}' oldHash='{}'",
                        CURL::GetRedacted(path), details.hash);
            // needs (re)caching
            AddJob(new CTextureCacheJob(path, details.hash));
          }
          ''')

          replace_once(
              "xbmc/TextureCache.cpp",
              '''  std::string url = CTextureUtils::UnwrapImageURL(image);
            if (url.empty())
              return "";

            std::unique_lock<CCriticalSection> lock(m_processingSection);
          ''',
              '''  std::string url = CTextureUtils::UnwrapImageURL(image);
            if (url.empty())
              return "";

            const bool jjsTrace = JjsArtistCacheTrace(image) || JjsArtistCacheTrace(url);
            if (jjsTrace)
              CLog::Log(LOGINFO, "[JJS-ARTCACHE][CacheImage] request='{}' source='{}'",
                        CURL::GetRedacted(image), CURL::GetRedacted(url));

            std::unique_lock<CCriticalSection> lock(m_processingSection);
