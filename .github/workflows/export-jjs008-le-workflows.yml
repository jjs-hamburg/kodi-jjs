name: Export JJS.008 LibreELEC workflows

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/export-jjs008-le-workflows.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Generic x86_64 build branch
        uses: actions/checkout@v5
        with:
          ref: build/21.3-jjs-008-libreelec
          path: x64

      - name: Checkout Raspberry Pi 4 build branch
        uses: actions/checkout@v5
        with:
          ref: build/21.3-jjs-008-rpi4
          path: rpi4

      - name: Collect exact workflow files
        shell: bash
        run: |
          set -euo pipefail
          mkdir export
          cp x64/.github/workflows/jjs-libreelec-12.2.1-test.yml export/x64.yml
          cp rpi4/.github/workflows/jjs-libreelec-12.2.1-test.yml export/rpi4.yml
          sha256sum export/x64.yml export/rpi4.yml > export/SHA256SUMS.txt

      - name: Upload workflow sources
        uses: actions/upload-artifact@v4
        with:
          name: jjs008-le-workflow-sources
          path: export/
          if-no-files-found: error
          retention-days: 1
