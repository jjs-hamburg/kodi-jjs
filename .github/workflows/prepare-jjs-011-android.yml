name: Prepare JJS.011 Android workflow

on:
  push:
    branches:
      - build/21.3-jjs-011-android
    paths:
      - ".github/workflows/prepare-jjs-011-android.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Update proven JJS.010 workflow for JJS.011
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/jjs-android-21.3.yml')
          s = p.read_text()
          replacements = {
              'build/21.3-jjs-010-android': 'build/21.3-jjs-011-android',
              'release/jjs010-music-browser-cache': 'release/jjs011-nfs-write-context-race',
              'f5cbef54a2d04807e35441b9fe84eaacbb4b3b6c': '51e9fccfb8fdfd3eb0601a29f249d86424dd0fbe',
              'JJS.010': 'JJS.011',
              'JJS_BUILD: "010"': 'JJS_BUILD: "011"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected marker missing: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          git diff -- .github/workflows/jjs-android-21.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/jjs-android-21.3.yml
          git commit -m "Build Android JJS.011 from validated NFS fix"
          git push
