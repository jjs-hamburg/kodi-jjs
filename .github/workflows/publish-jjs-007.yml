name: Publish Kodi JJS 21.3-JJS.007

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/publish-jjs-007.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANDROID_RUN_ID: "36559303462"
      ANDROID_ARTIFACT_ID: "11031611571"
      RPI4_RUN_ID: "36565881995"
      RPI4_ARTIFACT_ID: "11036740180"
      X64_RUN_ID: "36580624308"
      X64_ARTIFACT_ID: "11065334257"
      SOURCE_COMMIT: "16214aa086ffe96b92bd2ca6b5177754028c8b50"
      RELEASE_TAG: "v21.3-JJS.007"
      RELEASE_TITLE: "Kodi JJS 21.3-JJS.007 – Android ARM64 / LibreELEC x86_64 / Raspberry Pi 4"

    steps:
      - name: Download exact tested Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ANDROID_ARTIFACT_ID}/zip" \
            > android-artifact.zip
          mkdir android
          unzip -q android-artifact.zip -d android
          find android -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Download exact tested Raspberry Pi 4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RPI4_ARTIFACT_ID}/zip" \
            > rpi4-artifact.zip
          mkdir rpi4
          unzip -q rpi4-artifact.zip -d rpi4
          find rpi4 -type f -printf '%P\n' | sort

      - name: Download exact tested Generic x86_64 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${X64_ARTIFACT_ID}/zip" \
            > x64-artifact.zip
          mkdir x64
          unzip -q x64-artifact.zip -d x64
          find x64 -type f -printf '%P\n' | sort

      - name: Verify exact Android release artifact
        run: |
          set -euo pipefail
          cd android

          test -f BUILD-INFO.txt
          test -f SHA256SUMS.txt
          test -f AAPT-BADGING.txt
          test -f APKSIGNER-VERIFY.txt

          APK="$(find . -maxdepth 1 -type f -name 'Kodi-JJS-21.3-JJS.007-*-arm64.apk' -print -quit)"
          test -n "${APK}"

          grep -Fq "Kodi source commit: ${SOURCE_COMMIT}" BUILD-INFO.txt
          grep -Fq "Version: 21.3-JJS.007 (2103000)" BUILD-INFO.txt
          grep -Fq "Android package: org.jjs.kodi" BUILD-INFO.txt

          EXPECTED_SHA256="$(awk '{print $1; exit}' SHA256SUMS.txt)"
          ACTUAL_SHA256="$(sha256sum "${APK}" | awk '{print $1}')"
          test "${ACTUAL_SHA256}" = "${EXPECTED_SHA256}"

      - name: Verify exact LibreELEC Raspberry Pi 4 release artifact
        run: |
          set -euo pipefail
          test -f rpi4/kodi-jjs-gapless-libreelec.patch
          test -f rpi4/kodi-jjs-identity-libreelec.patch
          test -f rpi4/LibreELEC.tv/target/LibreELEC-RPi4.aarch64-12.2.1-JJS.007.tar
          test -f rpi4/LibreELEC.tv/target/LibreELEC-RPi4.aarch64-12.2.1-JJS.007.img.gz
          grep -Fq 'GUIWindowMusicBase.cpp' rpi4/kodi-jjs-gapless-libreelec.patch
          grep -Fq 'media/splash.jpg' rpi4/kodi-jjs-gapless-libreelec.patch
          grep -Fq 'VERSION_TAG JJS.007' rpi4/kodi-jjs-identity-libreelec.patch

      - name: Verify exact LibreELEC Generic x86_64 release artifact
        run: |
          set -euo pipefail
          test -f x64/kodi-jjs-gapless-libreelec.patch
          test -f x64/kodi-jjs-identity-libreelec.patch
          test -f x64/LibreELEC.tv/target/LibreELEC-Generic.x86_64-12.2.1-JJS.007.tar
          test -f x64/LibreELEC.tv/target/LibreELEC-Generic.x86_64-12.2.1-JJS.007.img.gz
          grep -Fq 'GUIWindowMusicBase.cpp' x64/kodi-jjs-gapless-libreelec.patch
          grep -Fq 'media/splash.jpg' x64/kodi-jjs-gapless-libreelec.patch
          grep -Fq 'VERSION_TAG JJS.007' x64/kodi-jjs-identity-libreelec.patch

      - name: Publish GitHub release from tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > RELEASE-NOTES.md <<'EOF'
          Kodi JJS 21.3-JJS.007.

          This release publishes the exact artifacts from the already successful and subsequently tested Android ARM64, LibreELEC Raspberry Pi 4 and LibreELEC Generic x86_64 workflows. It is not a rebuild.

          Confirmed platforms:
          - Android ARM64 / arm64-v8a (tested on NVIDIA Shield)
          - LibreELEC 12.2.1 Raspberry Pi 4 / aarch64
          - LibreELEC 12.2.1 Generic x86_64

          JJS.007 changes:
          - Music database startup guard: a -1 error return from GetMusicNeedsTagScan() is no longer treated as a pending tag scan, preventing the following database write from dereferencing an unavailable dataset.
          - New Kodi JJS splash screen on all three released platforms.
          - LibreELEC update safety: JJS builds default automatic system updates to manual and disable update notifications. Existing installations receive this setting once; later deliberate user changes are left untouched.

          The existing seamless RAW / TrueHD / Dolby Atmos handover and the JJS.004/JJS.005 playback-state fixes are unchanged.

          Android:
          - Package: org.jjs.kodi
          - Source workflow run: 36559303462

          LibreELEC Raspberry Pi 4:
          - Source workflow run: 36565881995

          LibreELEC Generic x86_64:
          - Source workflow run: 36580624308

          Kodi source branch: 21.3-Omega-jjs
          Kodi source commit: 16214aa086ffe96b92bd2ca6b5177754028c8b50

          Known LibreELEC limitation:
          - On the tested Intel HDA/HDMI systems, a small number of TrueHD/MAT track boundaries can still produce a brief audio interruption. This is separate from the JJS.007 changes and has also been reproduced outside Kodi on the same Linux/Intel HDMI audio path.
          EOF

          mapfile -t ANDROID_FILES < <(
            find android -maxdepth 1 -type f \
              \( -name '*.apk' -o -name '*.txt' \) -print | sort
          )

          mapfile -t RPI4_FILES < <(
            find rpi4 -type f \
              \( -name '*.tar' -o -name '*.img.gz' -o -name '*.sha256' \) -print | sort
          )

          mapfile -t X64_FILES < <(
            find x64 -type f \
              \( -name '*.tar' -o -name '*.img.gz' -o -name '*.sha256' \) -print | sort
          )

          RELEASE_FILES=(
            "${ANDROID_FILES[@]}"
            "${RPI4_FILES[@]}"
            "${X64_FILES[@]}"
            x64/kodi-jjs-gapless-libreelec.patch
            x64/kodi-jjs-identity-libreelec.patch
          )

          test "${#ANDROID_FILES[@]}" -gt 0
          test "${#RPI4_FILES[@]}" -gt 0
          test "${#X64_FILES[@]}" -gt 0

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              "${RELEASE_FILES[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --target "${SOURCE_COMMIT}" \
              --title "${RELEASE_TITLE}" \
              --notes-file RELEASE-NOTES.md \
              "${RELEASE_FILES[@]}"
          fi
