name: Publish Kodi JJS 21.3-JJS.012

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/publish-jjs-012.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANDROID_RUN_ID: "38079210115"
      ANDROID_HEAD_SHA: "ceb7d5a84e81c4929424343b41d95b8346ba5518"
      ANDROID_BRANCH: "build/21.3-jjs-012-android"
      ANDROID_ARTIFACT_ID: "11680663886"
      ANDROID_SOURCE_COMMIT: "9aa3022343e956353a2eb5beab676036bd35b9df"
      X64_RUN_ID: "38085002204"
      X64_HEAD_SHA: "e2059fbe194c055f50116473161b32331196c0ad"
      X64_BRANCH: "build/21.3-jjs-012-libreelec"
      X64_ARTIFACT_ID: "11693545153"
      RPI4_RUN_ID: "38150378825"
      RPI4_HEAD_SHA: "5b6cf3d745611cdefd94afeeca2e1f5da3ff7118"
      RPI4_BRANCH: "build/21.3-jjs-012-rpi4"
      RPI4_ARTIFACT_ID: "11708848565"
      SOURCE_COMMIT: "6f986afc0453b996209345003d5621fe9da5941a"
      RELEASE_TAG: "v21.3-JJS.012"
      RELEASE_TITLE: "Kodi JJS 21.3-JJS.012 – Android ARM64 / LibreELEC x86_64 / Raspberry Pi 4"

    steps:
      - name: Verify exact successful build runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          check_run() {
            local run_id="$1" expected_sha="$2" expected_branch="$3" label="$4"
            local json
            json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            test "$(jq -r '.status' <<<"$json")" = "completed"
            test "$(jq -r '.conclusion' <<<"$json")" = "success"
            test "$(jq -r '.head_sha' <<<"$json")" = "$expected_sha"
            test "$(jq -r '.head_branch' <<<"$json")" = "$expected_branch"
            echo "$label verified: run $run_id"
          }
          check_run "$ANDROID_RUN_ID" "$ANDROID_HEAD_SHA" "$ANDROID_BRANCH" "Android ARM64"
          check_run "$X64_RUN_ID" "$X64_HEAD_SHA" "$X64_BRANCH" "LibreELEC x86_64"
          check_run "$RPI4_RUN_ID" "$RPI4_HEAD_SHA" "$RPI4_BRANCH" "LibreELEC RPi4"

      - name: Download exact build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for spec in "android:$ANDROID_ARTIFACT_ID" "x64:$X64_ARTIFACT_ID" "rpi4:$RPI4_ARTIFACT_ID"; do
            dir="${spec%%:*}"
            id="${spec##*:}"
            mkdir "$dir"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$dir.zip"
            unzip -q "$dir.zip" -d "$dir"
            find "$dir" -type f -printf '%P\n' | sort
          done

      - name: Verify JJS.012 release payload
        shell: bash
        run: |
          set -euo pipefail
          test -f android/BUILD-INFO.txt
          test -f android/SHA256SUMS.txt
          test -f android/AAPT-BADGING.txt
          test -f android/APKSIGNER-VERIFY.txt
          APK="$(find android -maxdepth 1 -type f -name 'Kodi-JJS-21.3-JJS.012-*-arm64.apk' -print -quit)"
          test -n "$APK"
          grep -Fq "Kodi source commit: ${ANDROID_SOURCE_COMMIT}" android/BUILD-INFO.txt
          grep -Fq "Kodi JJS version tag: JJS.012" android/BUILD-INFO.txt
          grep -Fq "Version: 21.3-JJS.012 (2103000)" android/BUILD-INFO.txt
          grep -Fq "JJS.012 test: native movie-list bulk streamdetails + movie/set artwork preload" android/BUILD-INFO.txt
          EXPECTED="$(awk '{print $1; exit}' android/SHA256SUMS.txt)"
          ACTUAL="$(sha256sum "$APK" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"

          for dir in x64 rpi4; do
            test -f "$dir/kodi-jjs-gapless-libreelec.patch"
            test -f "$dir/kodi-jjs-identity-libreelec.patch"
            grep -Fq 'xbmc/video/VideoDatabase.cpp' "$dir/kodi-jjs-gapless-libreelec.patch"
            grep -Fq 'VERSION_TAG JJS.012' "$dir/kodi-jjs-identity-libreelec.patch"
          done
          test -n "$(find x64 -type f -name 'LibreELEC-Generic.x86_64-12.2.1-JJS.012.tar' -print -quit)"
          test -n "$(find x64 -type f -name 'LibreELEC-Generic.x86_64-12.2.1-JJS.012.img.gz' -print -quit)"
          test -n "$(find rpi4 -type f -name 'LibreELEC-RPi4.aarch64-12.2.1-JJS.012.tar' -print -quit)"
          test -n "$(find rpi4 -type f -name 'LibreELEC-RPi4.aarch64-12.2.1-JJS.012.img.gz' -print -quit)"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > RELEASE-NOTES.md <<'EOF'
          # JJS.012 – Faster large movie title lists

          Confirmed build platforms:
          - Android ARM64 / arm64-v8a
          - LibreELEC 12.2.1 Generic x86_64
          - LibreELEC 12.2.1 Raspberry Pi 4 / aarch64

          ## JJS.012 change

          - **Problem:** Opening large movie title lists could take a long time before all movie details were available, especially with a central MariaDB/MySQL video database.
          - **Cause:** After the movie list itself had already been loaded, Kodi could still fetch stream details and library artwork item by item. With large libraries this created a large number of additional database round trips.
          - **Solution:** JJS.012 bulk-loads stream details plus movie/set artwork for the complete native movie-title result set inside `CVideoDatabase`. This removes the per-movie database-query pattern while keeping Kodi's normal database abstraction for SQLite, MySQL and MariaDB.

          All JJS.011 and earlier fixes are retained, including the NFS write-context freeze fix, the JJS.009/JJS.010 music artwork/cache optimizations, seamless RAW / TrueHD / Dolby Atmos handover, MAT state preservation, RAW EOF backlog handling, music-library cancellation handling, DialogProgressBG lifecycle handling, Kodi JJS splash and LibreELEC update-safety defaults.
          EOF

          mapfile -t ANDROID_FILES < <(find android -maxdepth 1 -type f \( -name '*.apk' -o -name '*.txt' \) -print | sort)
          mapfile -t X64_FILES < <(find x64 -type f \( -name '*.tar' -o -name '*.img.gz' -o -name '*.sha256' \) -print | sort)
          mapfile -t RPI4_FILES < <(find rpi4 -type f \( -name '*.tar' -o -name '*.img.gz' -o -name '*.sha256' \) -print | sort)
          RELEASE_FILES=("${ANDROID_FILES[@]}" "${X64_FILES[@]}" "${RPI4_FILES[@]}" x64/kodi-jjs-gapless-libreelec.patch x64/kodi-jjs-identity-libreelec.patch)

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${RELEASE_FILES[@]}" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TITLE" --notes-file RELEASE-NOTES.md
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --title "$RELEASE_TITLE" --notes-file RELEASE-NOTES.md "${RELEASE_FILES[@]}"
          fi

      - name: Update README current release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')

          marker = """- **NFS file-operation freeze fixed – JJS.011**  
          **Important:** This was a bug in standard Kodi, not a Kodi JJS regression. The same freeze was reproduced with unmodified standard Kodi.  
          **Problem:** Kodi could freeze completely during NFS file operations when an active file write overlapped with access to another NFS export.  
          **Cause:** `CNFSFile::Write()` used a global write-chunk size which could temporarily become zero while another thread switched the active NFS context. A zero-length `nfs_write()` then returned zero bytes, while Kodi's write loop made no forward progress and continued indefinitely while holding the global NFS lock.  
          **Solution:** JJS.011 obtains the write limit from the NFS context belonging to the open file while holding the connection lock. Zero-length and zero-progress writes are explicitly rejected, preventing the condition from turning into an infinite loop.
          """
          addition = marker + """
          - **Slow large movie-title lists optimized – JJS.012**  
          **Problem:** Opening large movie title lists could take a long time before all movie details were available, especially with a central MariaDB/MySQL database.  
          **Cause:** Kodi could fetch stream details and library artwork item by item after the movie list itself had already been loaded, producing many additional database round trips.  
          **Solution:** JJS.012 bulk-loads stream details plus movie/set artwork for the complete native movie-title result set inside `CVideoDatabase`, eliminating the per-movie database-query pattern.
          """
          if marker not in s:
              raise SystemExit('README JJS.011 marker not found')
          s = s.replace(marker, addition, 1)

          replacements = {
              '**Kodi JJS 21.3-JJS.011 – Android ARM64 / LibreELEC Generic x86_64 / LibreELEC Raspberry Pi 4**': '**Kodi JJS 21.3-JJS.012 – Android ARM64 / LibreELEC Generic x86_64 / LibreELEC Raspberry Pi 4**',
              'https://github.com/jjs-hamburg/kodi-jjs/releases/tag/v21.3-JJS.011': 'https://github.com/jjs-hamburg/kodi-jjs/releases/tag/v21.3-JJS.012',
              'JJS.011 provides LibreELEC 12.2.1 builds for **Generic x86_64** and **Raspberry Pi 4 (aarch64)**.': 'JJS.012 provides LibreELEC 12.2.1 builds for **Generic x86_64** and **Raspberry Pi 4 (aarch64)**.',
              'JJS.011 source commit: **`51e9fccfb8fdfd3eb0601a29f249d86424dd0fbe`**': 'JJS.012 source commit: **`6f986afc0453b996209345003d5621fe9da5941a`**',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'README marker not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Document Kodi JJS 21.3-JJS.012 release"
            git push origin HEAD:master
          fi
