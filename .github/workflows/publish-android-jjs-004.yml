name: Publish Kodi JJS 21.3-JJS.004 Android

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/publish-android-jjs-004.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: "36256073797"
      SOURCE_ARTIFACT_ID: "10911946878"
      SOURCE_COMMIT: "0ee878276c2b05524ee962b9b4047e0ed52a96e4"
      RELEASE_TAG: "v21.3-JJS.004"
      RELEASE_TITLE: "Kodi JJS 21.3-JJS.004 – Android ARM64"

    steps:
      - name: Download exact tested artifact from successful Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api             -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip"             > artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          find artifact -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Verify exact release artifact
        run: |
          set -euo pipefail
          cd artifact
          test -f BUILD-INFO.txt
          test -f SHA256SUMS.txt
          APK="$(find . -maxdepth 1 -type f -name 'Kodi-JJS-21.3-JJS.004-*-arm64.apk' -print -quit)"
          test -n "${APK}"
          grep -Fq "Kodi source commit: ${SOURCE_COMMIT}" BUILD-INFO.txt
          grep -Fq "Version: 21.3-JJS.004 (2103000)" BUILD-INFO.txt
          grep -Fq "Android package: org.jjs.kodi" BUILD-INFO.txt
          EXPECTED_SHA256="$(awk '{print $1; exit}' SHA256SUMS.txt)"
          ACTUAL_SHA256="$(sha256sum "${APK}" | awk '{print $1}')"
          test "${ACTUAL_SHA256}" = "${EXPECTED_SHA256}"

      - name: Publish GitHub release from existing tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find artifact -maxdepth 1 -type f -name 'Kodi-JJS-21.3-JJS.004-*-arm64.apk' -print -quit)"

          cat > RELEASE-NOTES.md <<'EOF'
          Android ARM64 release of Kodi JJS 21.3-JJS.004.

          This is the exact signed APK produced by the already successful final Android workflow and subsequently tested in real use. It is not a rebuild.

          JJS.004 fixes the PAPlayer lifecycle race seen during manual track transitions. A stale PAPlayer start event could cause a newly created playback thread to exit before the new item became active, producing skipped tracks or a displayed track with stale elapsed time but no audio. The fix clears the stale start event before recreating the PAPlayer worker and preserves the compatible RAW-to-RAW seamless handover path.

          Target:
          - Android ARM64 / arm64-v8a
          - Package: org.jjs.kodi
          - Version: 21.3-JJS.004
          - Kodi source commit: 0ee878276c2b05524ee962b9b4047e0ed52a96e4
          - Source workflow run: 36256073797
          EOF

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"               "${APK}"               artifact/SHA256SUMS.txt               artifact/BUILD-INFO.txt               artifact/AAPT-BADGING.txt               artifact/APKSIGNER-VERIFY.txt               --clobber
          else
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"               --target "${SOURCE_COMMIT}"               --title "${RELEASE_TITLE}"               --notes-file RELEASE-NOTES.md               "${APK}"               artifact/SHA256SUMS.txt               artifact/BUILD-INFO.txt               artifact/AAPT-BADGING.txt               artifact/APKSIGNER-VERIFY.txt
          fi
