name: Patch JJS.009 LibreELEC source mirrors

on:
  push:
    branches:
      - infra/jjs009-libreelec-source-mirrors

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and dispatch LibreELEC builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/patch_jjs009_le_mirrors.sh
