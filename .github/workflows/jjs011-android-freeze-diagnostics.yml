name: Build Kodi JJS 21.3 JJS.011 Android Freeze Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - build/21.3-jjs-011-android-freeze-diagnostics
    paths:
      - ".github/workflows/jjs011-android-freeze-diagnostics.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      KODI_REPO: https://github.com/jjs-hamburg/kodi-jjs.git
      KODI_REF: release/jjs011-nfs-write-context-race
      EXPECTED_KODI_COMMIT: 51e9fccfb8fdfd3eb0601a29f249d86424dd0fbe
      EXPECTED_INTERNAL_APP_NAME: Kodi
      SOURCE_DISPLAY_NAME: Kodi JJS
      SOURCE_PACKAGE: org.jjs.kodi
      EXPECTED_DISPLAY_NAME: Kodi JJS
      EXPECTED_PACKAGE: org.jjs.kodi
      EXPECTED_VERSION_CODE: "2103000"
      EXPECTED_VERSION_NAME: "21.3-JJS.011"
      JJS_BUILD: "011-DIAG"
      JJS_VERSION_TAG: "JJS.011"
      JJS_ARTIFACT_NAME: Kodi-JJS-21.3-JJS.011-NFS-Freeze-Diagnostics-arm64
      EXPECTED_SIGNING_CERT_SHA256: caddfcba2d9ad9b880d410a048dd19c5212e2994669f226724250439a20840c6
      ANDROID_NDK_VERSION: 21.4.7075529
      ANDROID_BUILD_TOOLS_VERSION: 33.0.1
      KODI_DEPENDS: ${{ github.workspace }}/android-tools/xbmc-depends
      KODI_TARBALLS: ${{ github.workspace }}/android-tools/xbmc-tarballs
      KODI_BUILD: ${{ github.workspace }}/kodi-build

    steps:
      - name: Checkout diagnostic build wrapper
        uses: actions/checkout@v5

      - name: Check JJS signing secrets
        shell: bash
        env:
          JJS_KEYSTORE_B64: ${{ secrets.JJS_ANDROID_KEYSTORE_B64 }}
          JJS_STORE_PASS: ${{ secrets.JJS_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${JJS_KEYSTORE_B64}"
          test -n "${JJS_STORE_PASS}"

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/share/boost || true
          sudo rm -rf "${ANDROID_SDK_ROOT}/ndk"/* || true
          sudo rm -rf "${ANDROID_SDK_ROOT}/build-tools"/* || true
          sudo rm -rf "${ANDROID_SDK_ROOT}/platforms"/* || true
          sudo apt-get clean
          df -h /

      - name: Install host build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf bison build-essential curl flex gawk git gperf \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev unzip zip zlib1g-dev \
            ccache openjdk-17-jdk-headless

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Cache Kodi dependency downloads and compiled depends
        uses: actions/cache@v5
        with:
          path: |
            android-tools/xbmc-tarballs
            android-tools/xbmc-depends
          key: kodi-21.3-arm64-depends-r21e-v1

      - name: Seed verified build source archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${KODI_TARBALLS}"

          fetch_verified() {
            local name="$1"
            local url="$2"
            local sha512="$3"
            local target="${KODI_TARBALLS}/${name}"
            rm -f "${target}" "${target}.sha512"
            curl --http1.1 --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              --output "${target}" "${url}"
            printf '%s  %s\n' "${sha512}" "${target}" | sha512sum --check --strict
          }

          fetch_verified \
            "fontconfig-2.14.0.tar.xz" \
            "https://gstreamer.freedesktop.org/src/mirror/fontconfig-2.14.0.tar.xz" \
            "a5257249d031b3cd1a7b1521cd58f48d235a970020da4136a727db5407ec98e74a3776bc467d7e39f30ec664f56ff9fe39068317744a5e737a65109f7a005bfc"

          fetch_verified \
            "apache-groovy-binary-4.0.26.zip" \
            "https://archive.apache.org/dist/groovy/4.0.26/distribution/apache-groovy-binary-4.0.26.zip" \
            "60d1aea85008a438a9498178dc2137385653f1ea294e7e257959e9e0f94382e160e217e1090047c2a944e328cf46e8ebcfc4b015f7d0cb9f2fcf9d880c6c1344"

          fetch_verified \
            "commons-lang3-3.17.0-bin.tar.gz" \
            "https://archive.apache.org/dist/commons/lang/binaries/commons-lang3-3.17.0-bin.tar.gz" \
            "8927a406a1bd084b548f89cf15fe4bc7567dcaa50ae8abae54e9c883c1574c648fcc8ad6c3abaa381dfbdf1801727ac5e6c4572063203a1dfac293d122282f05"

          fetch_verified \
            "commons-text-1.13.0-bin.tar.gz" \
            "https://archive.apache.org/dist/commons/text/binaries/commons-text-1.13.0-bin.tar.gz" \
            "a51667463e88b2d017c3baebb9bbe42c4e50cba96ffe19c89680e82002a4db8b9007daff75f8dbf8bf3725be13a3f03f3c2bc4e1f11e8e02dcab4408abdb44a1"

      - name: Fetch exact JJS.011 source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --branch "${KODI_REF}" --depth 1 "${KODI_REPO}" kodi
          ACTUAL_COMMIT="$(git -C kodi rev-parse HEAD)"
          echo "Kodi JJS source: ${ACTUAL_COMMIT}"
          test "${ACTUAL_COMMIT}" = "${EXPECTED_KODI_COMMIT}"
          grep -qx "APP_NAME ${EXPECTED_INTERNAL_APP_NAME}" kodi/version.txt
          grep -qx "VERSION_TAG ${JJS_VERSION_TAG}" kodi/version.txt
          grep -qx "APP_PACKAGE ${SOURCE_PACKAGE}" kodi/version.txt
          grep -Fq "<string name=\"app_name\">${SOURCE_DISPLAY_NAME}</string>" \
            kodi/tools/android/packaging/xbmc/strings.xml.in
          git -C kodi diff --check
          test -z "$(git -C kodi status --porcelain)"

      - name: Instrument NFS write path for freeze diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("kodi/xbmc/filesystem/NFSFile.cpp")
          text = path.read_text(encoding="utf-8")
          start = text.index("ssize_t CNFSFile::Write(const void* lpBuf, size_t uiBufSize)\n{")
          end = text.index("\nbool CNFSFile::Delete(const CURL& url)", start)

          replacement = r'''ssize_t CNFSFile::Write(const void* lpBuf, size_t uiBufSize)
          {
            const auto diagId = std::chrono::steady_clock::now().time_since_epoch().count();
            size_t numberOfBytesWritten = 0;
            int writtenBytes = 0;
            size_t leftBytes = uiBufSize;

            CLog::Log(LOGINFO,
                      "[JJS-NFS-DIAG] id={} ENTER file='{}' requested={} bytes",
                      diagId, m_url.GetFileName(), uiBufSize);

            std::unique_lock<CCriticalSection> lock(gNfsConnection);

            if (m_pFileHandle == NULL || m_pNfsContext == NULL)
            {
              CLog::Log(LOGINFO,
                        "[JJS-NFS-DIAG] id={} INVALID-HANDLE fileHandle={} context={}",
                        diagId, m_pFileHandle != NULL, m_pNfsContext != NULL);
              return -1;
            }

            uint64_t maxWriteChunkSize = nfs_get_writemax(m_pNfsContext);
            const auto settings = CServiceBroker::GetSettingsComponent()->GetSettings();
            const uint64_t configuredChunkSize =
                settings ? (settings->GetInt(SETTING_NFS_CHUNKSIZE) * 1024) : (128 * 1024);
            const uint64_t serverWriteMax = maxWriteChunkSize;

            if (maxWriteChunkSize == 0 || configuredChunkSize < maxWriteChunkSize)
              maxWriteChunkSize = configuredChunkSize;

            size_t chunkSize = maxWriteChunkSize > 32768 ? 32768 : static_cast<size_t>(maxWriteChunkSize);

            CLog::Log(LOGINFO,
                      "[JJS-NFS-DIAG] id={} LIMITS server_writemax={} configured={} effective_max={} chunk={} requested={} left={}",
                      diagId, serverWriteMax, configuredChunkSize, maxWriteChunkSize, chunkSize,
                      uiBufSize, leftBytes);

            if (chunkSize == 0)
            {
              CLog::Log(LOGINFO,
                        "[JJS-NFS-DIAG] id={} ZERO-CHUNK server_writemax={} configured={} effective_max={}",
                        diagId, serverWriteMax, configuredChunkSize, maxWriteChunkSize);
              CLog::Log(LOGERROR, "Failed to pwrite({}) - invalid NFS write chunk size 0",
                        m_url.GetFileName());
              return -1;
            }

            size_t iteration = 0;
            while (leftBytes)
            {
              ++iteration;
              if (leftBytes < chunkSize)
                chunkSize = leftBytes;

              CLog::Log(LOGINFO,
                        "[JJS-NFS-DIAG] id={} CALL iter={} offset={} left={} chunk={}",
                        diagId, iteration, numberOfBytesWritten, leftBytes, chunkSize);

              const auto callStart = std::chrono::steady_clock::now();
          #ifdef LIBNFS_API_V2
              writtenBytes = nfs_write(m_pNfsContext, m_pFileHandle,
                                       static_cast<const char*>(lpBuf) + numberOfBytesWritten, chunkSize);
          #else
              writtenBytes = nfs_write(m_pNfsContext,
                                       m_pFileHandle,
                                       chunkSize,
                                       const_cast<char*>((const char*)lpBuf) + numberOfBytesWritten);
          #endif
              const auto callElapsed = std::chrono::duration_cast<std::chrono::milliseconds>(
                                           std::chrono::steady_clock::now() - callStart)
                                           .count();

              CLog::Log(LOGINFO,
                        "[JJS-NFS-DIAG] id={} RETURN iter={} result={} elapsed_ms={} before_total={} before_left={} chunk={}",
                        diagId, iteration, writtenBytes, callElapsed, numberOfBytesWritten,
                        leftBytes, chunkSize);

              if (writtenBytes <= 0)
              {
                if (writtenBytes < 0)
                {
                  CLog::Log(LOGINFO,
                            "[JJS-NFS-DIAG] id={} ERROR iter={} result={} nfs_error='{}' total={} left={}",
                            diagId, iteration, writtenBytes, nfs_get_error(m_pNfsContext),
                            numberOfBytesWritten, leftBytes);
                  CLog::Log(LOGERROR, "Failed to pwrite({}) {}", m_url.GetFileName(),
                            nfs_get_error(m_pNfsContext));
                }
                else
                {
                  CLog::Log(LOGINFO,
                            "[JJS-NFS-DIAG] id={} ZERO-PROGRESS iter={} total={} left={} chunk={}",
                            diagId, iteration, numberOfBytesWritten, leftBytes, chunkSize);
                  CLog::Log(LOGERROR, "Failed to pwrite({}) - NFS write returned 0 bytes",
                            m_url.GetFileName());
                }

                if (numberOfBytesWritten == 0)
                  return -1;

                break;
              }

              leftBytes -= writtenBytes;
              numberOfBytesWritten += writtenBytes;

              CLog::Log(LOGINFO,
                        "[JJS-NFS-DIAG] id={} PROGRESS iter={} total={} left={}",
                        diagId, iteration, numberOfBytesWritten, leftBytes);
            }

            CLog::Log(LOGINFO,
                      "[JJS-NFS-DIAG] id={} EXIT requested={} written={} remaining={}",
                      diagId, uiBufSize, numberOfBytesWritten, leftBytes);
            return numberOfBytesWritten;
          }
          '''

          # Remove the indentation introduced by the YAML heredoc while preserving C++ indentation.
          replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in replacement.splitlines()) + "\n"
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

          git -C kodi diff --check
          test "$(git -C kodi status --porcelain | wc -l)" -eq 1
          test "$(git -C kodi status --porcelain | awk '{print $2}')" = "xbmc/filesystem/NFSFile.cpp"
          grep -Fq '[JJS-NFS-DIAG]' kodi/xbmc/filesystem/NFSFile.cpp
          git -C kodi diff -- xbmc/filesystem/NFSFile.cpp

      - name: Verify diagnostic source identity
        shell: bash
        run: |
          set -euxo pipefail
          grep -qx "APP_PACKAGE ${EXPECTED_PACKAGE}" kodi/version.txt
          grep -Fq "<string name=\"app_name\">${EXPECTED_DISPLAY_NAME}</string>" \
            kodi/tools/android/packaging/xbmc/strings.xml.in
          test "$(git -C kodi status --porcelain | wc -l)" -eq 1
          test "$(git -C kodi status --porcelain | awk '{print $2}')" = "xbmc/filesystem/NFSFile.cpp"

      - name: Configure Kodi Android ARM64 depends
        working-directory: kodi/tools/depends
        run: |
          set -euxo pipefail
          mkdir -p "${KODI_TARBALLS}" "${KODI_DEPENDS}"
          ./bootstrap
          ./configure \
            --with-tarballs="${KODI_TARBALLS}" \
            --host=aarch64-linux-android \
            --with-sdk-path="${ANDROID_SDK_ROOT}" \
            --with-ndk-path="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" \
            --prefix="${KODI_DEPENDS}" \
            --disable-debug

      - name: Build Kodi depends
        working-directory: kodi/tools/depends
        run: |
          set -euxo pipefail
          make -j"$(nproc)"

      - name: Generate Kodi build tree
        working-directory: kodi
        run: |
          set -euxo pipefail
          mkdir -p "${KODI_BUILD}"
          make -C tools/depends/target/cmakebuildsys BUILD_DIR="${KODI_BUILD}"

      - name: Build Kodi JJS diagnostic APK
        working-directory: kodi-build
        run: |
          set -euxo pipefail
          make -j"$(nproc)"

      - name: Free packaging headroom
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "${KODI_TARBALLS}"
          rm -rf "${HOME}/.ccache" "${HOME}/.cache/pip" || true
          sudo apt-get clean
          df -h /

      - name: Build signed Kodi JJS diagnostic APK
        working-directory: kodi-build
        shell: bash
        env:
          JJS_KEYSTORE_B64: ${{ secrets.JJS_ANDROID_KEYSTORE_B64 }}
          JJS_STORE_PASS: ${{ secrets.JJS_ANDROID_KEYSTORE_PASSWORD }}
          JJS_KEY_PASS_SECRET: ${{ secrets.JJS_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/signing"
          KEYSTORE="${GITHUB_WORKSPACE}/signing/jjs-kodi.keystore"
          printf '%s' "${JJS_KEYSTORE_B64}" | base64 --decode > "${KEYSTORE}"
          chmod 600 "${KEYSTORE}"

          export LANG=C
          KEY_ALIAS="$(keytool -list \
            -keystore "${KEYSTORE}" \
            -storepass "${JJS_STORE_PASS}" 2>/dev/null \
            | awk -F, '/PrivateKeyEntry/{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit}')"
          test -n "${KEY_ALIAS}"

          JJS_KEY_PASS="${JJS_KEY_PASS_SECRET:-${JJS_STORE_PASS}}"
          export KODI_ANDROID_STORE_FILE="${KEYSTORE}"
          export KODI_ANDROID_STORE_PASSWORD="${JJS_STORE_PASS}"
          export KODI_ANDROID_KEY_ALIAS="${KEY_ALIAS}"
          export KODI_ANDROID_KEY_PASSWORD="${JJS_KEY_PASS}"

          make apk
          df -h /

      - name: Verify and collect installable diagnostic APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}"
          AAPT="${BUILD_TOOLS}/aapt"
          APKSIGNER="${BUILD_TOOLS}/apksigner"

          mkdir -p artifact
          APK="$(find "${GITHUB_WORKSPACE}/kodi" "${KODI_BUILD}" -type f -name '*.apk' -printf '%T@ %p\n' \
            | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "${APK}"

          "${AAPT}" dump badging "${APK}" | tee artifact/AAPT-BADGING.txt
          grep -q "package: name='${EXPECTED_PACKAGE}'" artifact/AAPT-BADGING.txt
          grep -q "versionCode='${EXPECTED_VERSION_CODE}'" artifact/AAPT-BADGING.txt
          grep -q "versionName='${EXPECTED_VERSION_NAME}'" artifact/AAPT-BADGING.txt
          grep -q "application-label:'${EXPECTED_DISPLAY_NAME}'" artifact/AAPT-BADGING.txt

          "${APKSIGNER}" verify --verbose --print-certs "${APK}" \
            | tee artifact/APKSIGNER-VERIFY.txt
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' artifact/APKSIGNER-VERIFY.txt \
            | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "${CERT_SHA256}" = "${EXPECTED_SIGNING_CERT_SHA256}"

          unzip -Z1 "${APK}" | grep -q '^lib/arm64-v8a/libkodi.so$'
          if unzip -Z1 "${APK}" | grep '^lib/' | grep -Ev '^lib/arm64-v8a/' >/dev/null; then
            echo "::error::Unexpected non-arm64 native libraries in APK"
            exit 1
          fi

          APK_BASENAME="Kodi-JJS-21.3-JJS.011-NFS-Freeze-Diagnostics-arm64.apk"
          cp "${APK}" "artifact/${APK_BASENAME}"
          APK_SHA256="$(sha256sum "artifact/${APK_BASENAME}" | awk '{print $1}')"
          LIB_SHA256="$(unzip -p "artifact/${APK_BASENAME}" lib/arm64-v8a/libkodi.so | sha256sum | awk '{print $1}')"

          cat > artifact/BUILD-INFO.txt <<EOF
          Kodi repository: ${KODI_REPO}
          Base Kodi source ref: ${KODI_REF}
          Base Kodi source commit: ${EXPECTED_KODI_COMMIT}
          Diagnostic modification: logging only in CNFSFile::Write()
          Diagnostic log prefix: [JJS-NFS-DIAG]
          Android display name: ${EXPECTED_DISPLAY_NAME}
          Android package: ${EXPECTED_PACKAGE}
          Version: ${EXPECTED_VERSION_NAME} (${EXPECTED_VERSION_CODE})
          APK filename: ${APK_BASENAME}
          Target: Android arm64-v8a
          NDK: ${ANDROID_NDK_VERSION}
          Signing certificate SHA256: ${CERT_SHA256}
          APK SHA256: ${APK_SHA256}
          libkodi.so SHA256: ${LIB_SHA256}
          Diagnostic wrapper commit: ${GITHUB_SHA}
          EOF

          git -C kodi diff -- xbmc/filesystem/NFSFile.cpp > artifact/NFS-WRITE-DIAGNOSTICS.patch
          sha256sum "artifact/${APK_BASENAME}" > artifact/SHA256SUMS.txt

      - name: Upload ready-to-install diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JJS_ARTIFACT_NAME }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
