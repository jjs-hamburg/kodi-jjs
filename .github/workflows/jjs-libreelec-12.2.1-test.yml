name: Build LibreELEC 12.2.1 RPi4 aarch64 JJS incremental

on:
  workflow_dispatch:
  push:
    branches:
      - build/21.3-jjs-012-rpi4

permissions:
  contents: read

jobs:
  build:
    name: Build LibreELEC JJS.012 incremental
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    env:
      LE_REPO: https://github.com/LibreELEC/LibreELEC.tv.git
      LE_REF: 12.2.1
      LE_COMMIT: 6209f5a3b067c45fbf527286dd84ee483294b46a
      KODI_REPO: https://github.com/jjs-hamburg/kodi-jjs.git
      KODI_BASE: a3a448d26b8d560a65655dab2cd122994dc4e146
      KODI_JJS: 6f986afc0453b996209345003d5621fe9da5941a
      REFERENCE_WRAPPER_COMMIT: 49e632ff750def572b4e1b6e20f5c8529e9d0fdb
      PROJECT: RPi
      DEVICE: RPi4
      ARCH: aarch64
      CONCURRENCY_MAKE_LEVEL: "4"
      CONCURRENCY_LOAD: "6.0"
      CCACHE_DIR: ${{ github.workspace }}/.libreelec-ccache
      LOCAL_CCACHE_DIR: ${{ github.workspace }}/.libreelec-ccache-local
      CCACHE_BASEDIR: ${{ github.workspace }}/LibreELEC.tv
      BUILD_STATE_DIR: LibreELEC.tv/build.LibreELEC-RPi4.aarch64-12.2.1-JJS.012
      BUILD_STATE_KEY: libreelec-12.2.1-rpi4-aarch64-buildstate-jjs012-v1

    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          df -h /

      - name: Install LibreELEC Jammy build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget bash bc gcc-12 sed patch patchutils tar bzip2 gzip xz-utils zstd perl \
            gawk gperf zip unzip diffutils lzop make file g++-12 xfonts-utils xsltproc \
            default-jre-headless python3 libc6-dev libncurses5-dev libjson-perl \
            libxml-parser-perl libparse-yapp-perl rdfind golang-1.21-go git \
            openssh-client rsync curl ccache
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          sudo update-alternatives --install /usr/bin/cpp cpp /usr/bin/cpp-12 100
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-12 100
          gcc --version
          g++ --version

      - name: Recover frozen known-good LibreELEC preparation steps
        shell: bash
        run: |
          set -euxo pipefail
          git init wrapper-reference
          git -C wrapper-reference remote add origin "${KODI_REPO}"
          git -C wrapper-reference fetch --depth=1 origin "${REFERENCE_WRAPPER_COMMIT}"
          git -C wrapper-reference show FETCH_HEAD:.github/workflows/jjs-libreelec-12.2.1-test.yml \
            > "${RUNNER_TEMP}/reference-workflow.yml"

          python3 - "${RUNNER_TEMP}/reference-workflow.yml" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text().splitlines()

          def extract(step_name, output):
              job = next(i for i, line in enumerate(lines) if line == "  build:")
              marker = f"      - name: {step_name}"
              step = next(i for i in range(job + 1, len(lines)) if lines[i] == marker)
              run = next(i for i in range(step + 1, len(lines)) if lines[i] == "        run: |")
              body = []
              for line in lines[run + 1:]:
                  if line.startswith("          "):
                      body.append(line[10:])
                  elif not line:
                      body.append("")
                  else:
                      break
              if not body:
                  raise SystemExit(f"No run block found for {step_name}")
              Path(output).write_text("\n".join(body) + "\n")

          extract("Checkout exact LibreELEC 12.2.1 source", "/tmp/prepare-libreelec.sh")
          extract("Preflight all LibreELEC source downloads", "/tmp/preflight-libreelec.sh")
          PY

          chmod +x /tmp/prepare-libreelec.sh /tmp/preflight-libreelec.sh
          bash /tmp/prepare-libreelec.sh

      - name: Cache frozen LibreELEC source snapshot
        id: source_snapshot_cache
        uses: actions/cache@v4
        with:
          path: LibreELEC.tv/sources
          key: libreelec-12.2.1-rpi4-aarch64-source-snapshot-v1

      - name: Hydrate frozen LibreELEC source snapshot
        if: steps.source_snapshot_cache.outputs.cache-hit != 'true'
        uses: jjs-hamburg/kodi-jjs/.github/actions/hydrate-libreelec-12.2.1-sources@8aa9540b6d08955f1af7b4efbdafa30c2bbbe976
        with:
          libreelec-dir: LibreELEC.tv

      - name: Preflight all LibreELEC source downloads
        timeout-minutes: 45
        working-directory: LibreELEC.tv
        shell: bash
        run: bash /tmp/preflight-libreelec.sh

      - name: Restore LibreELEC compiler cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .libreelec-ccache
            .libreelec-ccache-local
          key: libreelec-12.2.1-rpi4-aarch64-ccache-restore-${{ github.run_id }}
          restore-keys: |
            libreelec-12.2.1-rpi4-aarch64-ccache-v3-
            libreelec-12.2.1-rpi4-aarch64-ccache-v2-
            libreelec-12.2.1-rpi4-aarch64-ccache-v1-bootstrap-

      - name: Restore persistent LibreELEC build state
        id: build_state
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_STATE_DIR }}
          key: ${{ env.BUILD_STATE_KEY }}

      - name: Show restored cache state
        shell: bash
        run: |
          set -euxo pipefail
          echo "Build-state cache hit: ${{ steps.build_state.outputs.cache-hit }}"
          du -sh "${BUILD_STATE_DIR}" 2>/dev/null || true
          du -sh "${CCACHE_DIR}" "${LOCAL_CCACHE_DIR}" 2>/dev/null || true
          df -h /

      - name: Generate Kodi JJS functional patch
        shell: bash
        run: |
          set -euxo pipefail
          git init kodi-jjs
          git -C kodi-jjs remote add origin "${KODI_REPO}"
          git -C kodi-jjs fetch --depth=1 origin "${KODI_BASE}"
          git -C kodi-jjs fetch --depth=1 origin "${KODI_JJS}"

          PATCH="$GITHUB_WORKSPACE/kodi-jjs-gapless-libreelec.patch"
          FILES=(
            xbmc/application/ApplicationPlayer.cpp
            xbmc/application/ApplicationPlayerCallback.cpp
            xbmc/music/windows/GUIWindowMusicBase.cpp
            xbmc/music/infoscanner/MusicInfoScanner.cpp
            xbmc/music/MusicDatabase.cpp
            xbmc/music/MusicInfoLoader.cpp
            xbmc/music/MusicThumbLoader.cpp
            xbmc/music/MusicThumbLoader.h
            xbmc/filesystem/NFSFile.cpp
            xbmc/video/VideoDatabase.cpp
            xbmc/windows/GUIMediaWindow.cpp
            xbmc/interfaces/legacy/Dialog.cpp
            media/splash.jpg
            xbmc/cores/AudioEngine/Engines/ActiveAE/ActiveAESink.cpp
            xbmc/cores/AudioEngine/Sinks/AESinkALSA.cpp
            xbmc/cores/AudioEngine/Utils/PackerMAT.cpp
            xbmc/cores/AudioEngine/Utils/PackerMAT.h
            xbmc/cores/VideoPlayer/DVDCodecs/Audio/DVDAudioCodecPassthrough.cpp
            xbmc/cores/VideoPlayer/DVDCodecs/Audio/DVDAudioCodecPassthrough.h
            xbmc/cores/paplayer/AudioDecoder.cpp
            xbmc/cores/paplayer/AudioDecoder.h
            xbmc/cores/paplayer/ICodec.h
            xbmc/cores/paplayer/PAPlayer.cpp
            xbmc/cores/paplayer/PAPlayer.h
            xbmc/cores/paplayer/VideoPlayerCodec.cpp
            xbmc/cores/paplayer/VideoPlayerCodec.h
          )

          git -C kodi-jjs diff --binary --no-ext-diff "${KODI_BASE}" "${KODI_JJS}" -- "${FILES[@]}" > "$PATCH"
          test -s "$PATCH"
          ! grep -q 'TRUEHDTRACE' "$PATCH"
          ! grep -q 'README.JJS' "$PATCH"
          ! grep -q 'tools/android/packaging' "$PATCH"
          cp "$PATCH" LibreELEC.tv/packages/mediacenter/kodi/patches/kodi-999.90-jjs-gapless.patch

          ID_BASE="$GITHUB_WORKSPACE/version-libreelec-base.txt"
          ID_JJS="$GITHUB_WORKSPACE/version-libreelec-jjs.txt"
          ID_PATCH="$GITHUB_WORKSPACE/kodi-jjs-identity-libreelec.patch"
          git -C kodi-jjs show "${KODI_BASE}:version.txt" > "$ID_BASE"
          cp "$ID_BASE" "$ID_JJS"
          sed -i -e 's/^VERSION_TAG.*/VERSION_TAG JJS.012/' "$ID_JJS"
          diff -u --label a/version.txt --label b/version.txt "$ID_BASE" "$ID_JJS" > "$ID_PATCH" || test $? -eq 1
          git -C kodi-jjs diff --binary --no-ext-diff "${KODI_BASE}" "${KODI_JJS}" -- \
            xbmc/windows/GUIWindowSystemInfo.cpp >> "$ID_PATCH"
          test -s "$ID_PATCH"
          cp "$ID_PATCH" LibreELEC.tv/packages/mediacenter/kodi/patches/kodi-999.91-jjs-identity.patch

          echo "Patch statistics:"
          git -C kodi-jjs diff --stat "${KODI_BASE}" "${KODI_JJS}" -- "${FILES[@]}"

      - name: Keep stable incremental build directory identity
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/LIBREELEC_VERSION="devel"/LIBREELEC_VERSION="12.2.1-JJS.012"/' \
            LibreELEC.tv/distributions/LibreELEC/version
          grep LIBREELEC_VERSION LibreELEC.tv/distributions/LibreELEC/version

      - name: Verify LibreELEC build host
        working-directory: LibreELEC.tv
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/checkdeps
          mkdir -p "${CCACHE_DIR}" "${LOCAL_CCACHE_DIR}"
          df -h /

      - name: Build RPi4 aarch64 update image
        id: build_image
        working-directory: LibreELEC.tv
        shell: bash
        run: |
          set +e
          timeout --verbose --signal=INT --kill-after=120s 285m \
            bash -o pipefail -c 'make image 2>&1 | tee "${GITHUB_WORKSPACE}/libreelec-build.log"'
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "LibreELEC build stopped with rc=${rc}; caches will be preserved."
          fi
          sync
          exit 0

      - name: Save updated LibreELEC compiler cache
        uses: actions/cache/save@v4
        with:
          path: |
            .libreelec-ccache
            .libreelec-ccache-local
          key: libreelec-12.2.1-rpi4-aarch64-ccache-v3-${{ github.run_id }}

      - name: Prepare persistent build-state cache
        id: prepare_build_state
        if: steps.build_image.outputs.complete == 'true' && steps.build_state.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          test -d "${BUILD_STATE_DIR}"

          # These directories are recreated for every image and only waste cache space.
          rm -rf "${BUILD_STATE_DIR}/image" \
                 "${BUILD_STATE_DIR}/qa_checks" \
                 "${BUILD_STATE_DIR}/.threads" \
                 "${BUILD_STATE_DIR}/.unpack"

          # A changed Kodi patch causes LibreELEC to unpack Kodi from scratch anyway.
          # Keep the installed Kodi package and stamps, but not its disposable source/build tree.
          rm -rf "${BUILD_STATE_DIR}"/build/kodi-*

          size_mb="$(du -sm "${BUILD_STATE_DIR}" | awk '{print $1}')"
          echo "Persistent build state: ${size_mb} MiB"
          du -sh "${BUILD_STATE_DIR}"
          df -h /

          if [ "${size_mb}" -le 7000 ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "Build state exceeds 7000 MiB; skip cache save to avoid cache thrashing."
          fi

      - name: Save persistent LibreELEC build state
        if: steps.prepare_build_state.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BUILD_STATE_DIR }}
          key: ${{ env.BUILD_STATE_KEY }}

      - name: Show build outputs
        if: always()
        shell: bash
        run: |
          set -x
          echo "Build-state cache hit: ${{ steps.build_state.outputs.cache-hit }}"
          df -h /
          find LibreELEC.tv/target -maxdepth 1 -type f -printf '%f  %s bytes\n' 2>/dev/null | sort || true

      - name: Prepare LibreELEC build diagnostics
        if: steps.build_image.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DIAG_DIR="libreelec-build-diagnostics"
          rm -rf "$DIAG_DIR"
          mkdir -p "$DIAG_DIR/thread-logs"
          tail -n 1000 libreelec-build.log > "$DIAG_DIR/libreelec-build-tail.log"
          printf 'LibreELEC build rc=%s\n' "${{ steps.build_image.outputs.rc }}" > "$DIAG_DIR/build-result.txt"

          while IFS= read -r -d '' log_file; do
            relative="${log_file#LibreELEC.tv/}"
            destination="$DIAG_DIR/thread-logs/$relative"
            mkdir -p "$(dirname "$destination")"
            cp "$log_file" "$destination"
          done < <(find LibreELEC.tv -path '*/.threads/logs/*.log' -type f -print0)

      - name: Upload LibreELEC build diagnostics
        if: steps.build_image.outputs.complete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LibreELEC-JJS.012-incremental-build-diagnostics
          path: libreelec-build-diagnostics
          if-no-files-found: error
          retention-days: 14

      - name: Upload LibreELEC update image
        if: steps.build_image.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LibreELEC-RPi4-aarch64-12.2.1-JJS.012-incremental
          if-no-files-found: error
          retention-days: 14
          path: |
            LibreELEC.tv/target/*.tar
            LibreELEC.tv/target/*.img.gz
            LibreELEC.tv/target/*.sha256
            kodi-jjs-gapless-libreelec.patch
            kodi-jjs-identity-libreelec.patch

      - name: Fail after preserving caches if image is incomplete
        if: steps.build_image.outputs.complete != 'true'
        shell: bash
        run: |
          echo "LibreELEC build did not complete (rc=${{ steps.build_image.outputs.rc }})."
          echo "Detailed diagnostics and compiler cache have been saved."
          exit 1
