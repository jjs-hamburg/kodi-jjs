name: Build LibreELEC 12.2.1 Generic x86_64 JJS TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prime_ccache:
    name: Prime LibreELEC ccache once
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    env:
      LE_REPO: https://github.com/LibreELEC/LibreELEC.tv.git
      LE_REF: 12.2.1
      LE_COMMIT: 6209f5a3b067c45fbf527286dd84ee483294b46a
      PROJECT: Generic
      DEVICE: Generic
      ARCH: x86_64
      CONCURRENCY_MAKE_LEVEL: "4"
      CONCURRENCY_LOAD: "6.0"
      CCACHE_DIR: ${{ github.workspace }}/.libreelec-ccache
      LOCAL_CCACHE_DIR: ${{ github.workspace }}/.libreelec-ccache-local
      CCACHE_BASEDIR: ${{ github.workspace }}/LibreELEC.tv

    steps:
      - name: Check for existing LibreELEC ccache seed
        id: ccache_seed
        uses: actions/cache/restore@v4
        with:
          path: .libreelec-ccache-ready
          key: libreelec-12.2.1-generic-x86_64-ccache-ready-v1
          lookup-only: true

      - name: Free runner disk space
        if: steps.ccache_seed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          df -h /

      - name: Install LibreELEC Jammy build dependencies
        if: steps.ccache_seed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget bash bc gcc-12 sed patch patchutils tar bzip2 gzip xz-utils zstd perl \
            gawk gperf zip unzip diffutils lzop make file g++-12 xfonts-utils xsltproc \
            default-jre-headless python3 libc6-dev libncurses5-dev libjson-perl \
            libxml-parser-perl libparse-yapp-perl rdfind golang-1.21-go git \
            openssh-client rsync
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          sudo update-alternatives --install /usr/bin/cpp cpp /usr/bin/cpp-12 100
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-12 100

      - name: Checkout exact LibreELEC 12.2.1 source
        if: steps.ccache_seed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "${LE_REPO}" LibreELEC.tv
          git -C LibreELEC.tv fetch --depth=1 origin "${LE_REF}"
          git -C LibreELEC.tv checkout --detach "${LE_COMMIT}"
          test "$(git -C LibreELEC.tv rev-parse HEAD)" = "${LE_COMMIT}"
          grep -q 'PKG_VERSION="21.3-Omega"' LibreELEC.tv/packages/mediacenter/kodi/package.mk

          # wireguard-tools v1.0.20250521 currently produces different snapshot
          # archive bytes at the official upstream URL than LibreELEC 12.2.1 pinned.
          # Keep package version and URL unchanged; update only the expected hash.
          WG_PKG="LibreELEC.tv/packages/network/wireguard-tools/package.mk"
          WG_OLD_SHA="6afe492647c3b0b2f68ab6df524e9e4290d03c34c3027e069e5bbc486949960e"
          WG_NEW_SHA="e1b54c682c9734e81f8bd030eb00f2b33d3f09dfbd8397766d266c299c37e3fb"
          WG_CURRENT_SHA="$(sed -n 's/^PKG_SHA256="\([^"]*\)"/\1/p' "$WG_PKG")"
          test "$WG_CURRENT_SHA" = "$WG_OLD_SHA"
          sed -i "s/^PKG_SHA256=.*/PKG_SHA256=\"$WG_NEW_SHA\"/" "$WG_PKG"
          grep '^PKG_SHA256=' "$WG_PKG"

          while IFS= read -r -d '' f; do
            sed -E -i \
              -e 's#https?://ftpmirror\.gnu\.org/#https://ftp.gnu.org/gnu/#g' \
              -e 's#https://ftp\.gnu\.org/gnu/gnu/#https://ftp.gnu.org/gnu/#g' \
              "$f"
          done < <(grep -rlZ 'ftpmirror.gnu.org' LibreELEC.tv/packages)
          if grep -R 'ftpmirror.gnu.org' LibreELEC.tv/packages; then
            echo "Unrewritten GNU mirror URL remains" >&2
            exit 1
          fi

          sed -i \
            's#https://github.com/plougher/squashfs-tools/archive/${PKG_VERSION}.tar.gz#https://github.com/plougher/squashfs-tools/releases/download/${PKG_VERSION}/${PKG_NAME}-${PKG_VERSION}.tar.gz#' \
            LibreELEC.tv/packages/sysutils/squashfs-tools/package.mk

          sed -i \
            's#https://gmplib.org/download/gmp/${PKG_NAME}-${PKG_VERSION}.tar.xz#https://ftp.gnu.org/gnu/gmp/${PKG_NAME}-${PKG_VERSION}.tar.xz#' \
            LibreELEC.tv/packages/devel/gmp/package.mk

          sed -i \
            's#http://repo.or.cz/rtmpdump.git/snapshot/${PKG_VERSION}.tar.gz#https://mirrors.mit.edu/macports/distfiles/rtmpdump/${PKG_VERSION}.tar.gz#' \
            LibreELEC.tv/packages/multimedia/rtmpdump/package.mk

          sed -i \
            's#https://code.videolan.org/videolan/${PKG_NAME}/-/archive/${PKG_VERSION}/${PKG_NAME}-${PKG_VERSION}.tar.gz#https://mirrors.kodi.tv/build-deps/sources/${PKG_NAME}-${PKG_VERSION}.tar.gz#' \
            LibreELEC.tv/packages/multimedia/libudfread/package.mk

          sed -i \
            's#http://www.freedesktop.org/software/pulseaudio/releases/${PKG_NAME}-${PKG_VERSION}.tar.xz#https://na.edge.kernel.org/gentoo/distfiles/62/${PKG_NAME}-${PKG_VERSION}.tar.xz#' \
            LibreELEC.tv/packages/audio/pulseaudio/package.mk

          sed -i \
            's#http://www.freedesktop.org/software/libevdev/${PKG_NAME}-${PKG_VERSION}.tar.xz#https://mirrors.xmission.com/gentoo/distfiles/d4/${PKG_NAME}-${PKG_VERSION}.tar.xz#' \
            LibreELEC.tv/packages/sysutils/libevdev/package.mk

          sed -i \
            's#http://linuxtv.org/downloads/v4l-utils/${PKG_NAME}-${PKG_VERSION}.tar.xz#https://archive.ubuntu.com/ubuntu/pool/main/v/v4l-utils/v4l-utils_${PKG_VERSION}.orig.tar.xz#' \
            LibreELEC.tv/packages/sysutils/v4l-utils/package.mk

          sed -i \
            's#https://github.com/alpharde/udevil/archive/${PKG_VERSION}.tar.gz#https://github.com/Arnie97/udevil-ng/archive/${PKG_VERSION}.tar.gz#' \
            LibreELEC.tv/packages/sysutils/udevil/package.mk
          udevil_version="$(sed -n 's/^PKG_VERSION="\([^"]*\)"/\1/p' LibreELEC.tv/packages/sysutils/udevil/package.mk)"
          udevil_url="https://github.com/Arnie97/udevil-ng/archive/${udevil_version}.tar.gz"
          udevil_tmp="$(mktemp)"
          wget -q --timeout=30 --tries=3 -O "$udevil_tmp" "$udevil_url"
          udevil_sha="$(sha256sum "$udevil_tmp" | awk '{print $1}')"
          rm -f "$udevil_tmp"
          sed -i "s/^PKG_SHA256=.*/PKG_SHA256=\"$udevil_sha\"/" \
            LibreELEC.tv/packages/sysutils/udevil/package.mk

          # LibreELEC 12.2.1 builds host tools with -march=native. That is not
          # safe when ccache is restored on a different GitHub runner CPU:
          # cached host objects may contain instructions unsupported by the next
          # runner and crash with "Illegal instruction". Keep target flags
          # untouched; make only host tools portable across x86_64 runners.
          sed -i \
            's/^HOST_CFLAGS="-march=native /HOST_CFLAGS="-march=x86-64 /' \
            LibreELEC.tv/config/optimize
          grep '^HOST_CFLAGS=' LibreELEC.tv/config/optimize

          sed -i 's/^CCACHE_CACHE_SIZE=.*/CCACHE_CACHE_SIZE="5G"/' \
            LibreELEC.tv/config/options

          sed -i 's/LIBREELEC_VERSION="devel"/LIBREELEC_VERSION="12.2.1-JJS.003-Test"/' \
            LibreELEC.tv/distributions/LibreELEC/version

      - name: Cache LibreELEC source archives
        if: steps.ccache_seed.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: LibreELEC.tv/sources
          key: libreelec-12.2.1-generic-x86_64-sources-v1
          restore-keys: |
            libreelec-12.2.1-generic-x86_64-sources-

      - name: Preflight all LibreELEC source downloads
        if: steps.ccache_seed.outputs.cache-hit != 'true'
        timeout-minutes: 45
        working-directory: LibreELEC.tv
        shell: bash
        run: |
          set -euo pipefail
          PLAN="${RUNNER_TEMP}/libreelec-image-plan.json"
          PKGS="${RUNNER_TEMP}/libreelec-image-packages.txt"

          ./scripts/pkgjson | ./scripts/genbuildplan.py \
            --with-json "$PLAN" --build image >/dev/null

          python3 - "$PLAN" > "$PKGS" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              plan = json.load(f)

          seen = set()
          for step in plan:
              package = step["name"].split(":", 1)[0]
              if package not in seen:
                  seen.add(package)
                  print(package)
          PY

          echo "Preflight source packages: $(wc -l < "$PKGS")"

          failures=()
          while IFS= read -r package; do
            if ! ./scripts/get "$package"; then
              failures+=("$package")
            fi
          done < "$PKGS"

          if ((${#failures[@]})); then
            printf 'Source preflight failed for %d package(s):\n' "${#failures[@]}" >&2
            printf '  %s\n' "${failures[@]}" >&2
            exit 1
          fi

      - name: Verify LibreELEC build host
        if: steps.ccache_seed.outputs.cache-hit != 'true'
        working-directory: LibreELEC.tv
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/checkdeps
          mkdir -p "${CCACHE_DIR}" "${LOCAL_CCACHE_DIR}"
          df -h /

      - name: Warm compiler cache for up to five hours
        if: steps.ccache_seed.outputs.cache-hit != 'true'
        working-directory: LibreELEC.tv
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=120s 300m make image
          rc=$?
          set -e
          echo "Prime build stopped with rc=${rc}; ccache will now be saved."
          sync
          exit 0

      - name: Save LibreELEC compiler cache seed
        if: steps.ccache_seed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .libreelec-ccache
            .libreelec-ccache-local
          key: libreelec-12.2.1-generic-x86_64-ccache-v1-bootstrap-${{ github.run_id }}

      - name: Mark compiler cache seed ready
        if: steps.ccache_seed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .libreelec-ccache-ready
          printf '%s\n' "LibreELEC 12.2.1 Generic x86_64 ccache bootstrap complete" \
            > .libreelec-ccache-ready/ready.txt

      - name: Save compiler cache seed marker
        if: steps.ccache_seed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .libreelec-ccache-ready
          key: libreelec-12.2.1-generic-x86_64-ccache-ready-v1

  build:
    name: Build LibreELEC JJS.003
    needs: prime_ccache
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    env:
      LE_REPO: https://github.com/LibreELEC/LibreELEC.tv.git
      LE_REF: 12.2.1
      LE_COMMIT: 6209f5a3b067c45fbf527286dd84ee483294b46a
      KODI_REPO: https://github.com/jjs-hamburg/kodi-jjs.git
      KODI_BASE: a3a448d26b8d560a65655dab2cd122994dc4e146
      KODI_JJS: 5cba00675177235e4403428972a0a929b784be9e
      PROJECT: Generic
      DEVICE: Generic
      ARCH: x86_64
      CONCURRENCY_MAKE_LEVEL: "4"
      CONCURRENCY_LOAD: "6.0"
      CCACHE_DIR: ${{ github.workspace }}/.libreelec-ccache
      LOCAL_CCACHE_DIR: ${{ github.workspace }}/.libreelec-ccache-local
      CCACHE_BASEDIR: ${{ github.workspace }}/LibreELEC.tv

    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          df -h /

      - name: Install LibreELEC Jammy build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget bash bc gcc-12 sed patch patchutils tar bzip2 gzip xz-utils zstd perl \
            gawk gperf zip unzip diffutils lzop make file g++-12 xfonts-utils xsltproc \
            default-jre-headless python3 libc6-dev libncurses5-dev libjson-perl \
            libxml-parser-perl libparse-yapp-perl rdfind golang-1.21-go git \
            openssh-client rsync
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          sudo update-alternatives --install /usr/bin/cpp cpp /usr/bin/cpp-12 100
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-12 100
          gcc --version
          g++ --version

      - name: Checkout exact LibreELEC 12.2.1 source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "${LE_REPO}" LibreELEC.tv
          git -C LibreELEC.tv fetch --depth=1 origin "${LE_REF}"
          git -C LibreELEC.tv checkout --detach "${LE_COMMIT}"
          test "$(git -C LibreELEC.tv rev-parse HEAD)" = "${LE_COMMIT}"
          grep -q 'PKG_VERSION="21.3-Omega"' LibreELEC.tv/packages/mediacenter/kodi/package.mk

          # wireguard-tools v1.0.20250521 currently produces different snapshot
          # archive bytes at the official upstream URL than LibreELEC 12.2.1 pinned.
          # Keep package version and URL unchanged; update only the expected hash.
          WG_PKG="LibreELEC.tv/packages/network/wireguard-tools/package.mk"
          WG_OLD_SHA="6afe492647c3b0b2f68ab6df524e9e4290d03c34c3027e069e5bbc486949960e"
          WG_NEW_SHA="e1b54c682c9734e81f8bd030eb00f2b33d3f09dfbd8397766d266c299c37e3fb"
          WG_CURRENT_SHA="$(sed -n 's/^PKG_SHA256="\([^"]*\)"/\1/p' "$WG_PKG")"
          test "$WG_CURRENT_SHA" = "$WG_OLD_SHA"
          sed -i "s/^PKG_SHA256=.*/PKG_SHA256=\"$WG_NEW_SHA\"/" "$WG_PKG"
          grep '^PKG_SHA256=' "$WG_PKG"

          # LibreELEC 12.2.1 contains a number of GNU package URLs via
          # ftpmirror.gnu.org. Its redirects currently hit mirrors returning
          # 404 for these older release tarballs. Rewrite all such package URLs
          # to GNU's canonical archive, keeping the exact versions/checksums.
          while IFS= read -r -d '' f; do
            sed -E -i \
              -e 's#https?://ftpmirror\.gnu\.org/#https://ftp.gnu.org/gnu/#g' \
              -e 's#https://ftp\.gnu\.org/gnu/gnu/#https://ftp.gnu.org/gnu/#g' \
              "$f"
          done < <(grep -rlZ 'ftpmirror.gnu.org' LibreELEC.tv/packages)
          if grep -R 'ftpmirror.gnu.org' LibreELEC.tv/packages; then
            echo "Unrewritten GNU mirror URL remains" >&2
            exit 1
          fi

          # GitHub's generated archive for squashfs-tools 4.6.1 is no longer
          # byte-identical to the archive LibreELEC 12.2.1 hashed. Upstream now
          # publishes the original release asset; its SHA256 is exactly the
          # LibreELEC 12.2.1 expected value 94201754...
          sed -i \
            's#https://github.com/plougher/squashfs-tools/archive/${PKG_VERSION}.tar.gz#https://github.com/plougher/squashfs-tools/releases/download/${PKG_VERSION}/${PKG_NAME}-${PKG_VERSION}.tar.gz#' \
            LibreELEC.tv/packages/sysutils/squashfs-tools/package.mk
          grep '^PKG_URL=' LibreELEC.tv/packages/sysutils/squashfs-tools/package.mk

          # gmplib.org currently times out from GitHub Actions, while LibreELEC's
          # fallback mirror no longer carries GMP 6.3.0. GNU's canonical archive
          # contains the identical release tarball, so keep version/checksum and
          # replace only the source URL.
          sed -i \
            's#https://gmplib.org/download/gmp/${PKG_NAME}-${PKG_VERSION}.tar.xz#https://ftp.gnu.org/gnu/gmp/${PKG_NAME}-${PKG_VERSION}.tar.xz#' \
            LibreELEC.tv/packages/devel/gmp/package.mk
          grep '^PKG_URL=' LibreELEC.tv/packages/devel/gmp/package.mk

          # repo.or.cz currently returns an HTML page for the pinned rtmpdump
          # snapshot. MacPorts mirrors the exact 143043-byte archive with the
          # same SHA256 already pinned by LibreELEC 12.2.1.
          sed -i \
            's#http://repo.or.cz/rtmpdump.git/snapshot/${PKG_VERSION}.tar.gz#https://mirrors.mit.edu/macports/distfiles/rtmpdump/${PKG_VERSION}.tar.gz#' \
            LibreELEC.tv/packages/multimedia/rtmpdump/package.mk
          grep '^PKG_URL=' LibreELEC.tv/packages/multimedia/rtmpdump/package.mk

          # code.videolan.org currently serves an HTML page instead of the
          # libudfread 1.1.2 archive. Kodi's build-deps mirror carries the
          # exact 33744-byte archive with LibreELEC's pinned SHA256.
          sed -i \
            's#https://code.videolan.org/videolan/${PKG_NAME}/-/archive/${PKG_VERSION}/${PKG_NAME}-${PKG_VERSION}.tar.gz#https://mirrors.kodi.tv/build-deps/sources/${PKG_NAME}-${PKG_VERSION}.tar.gz#' \
            LibreELEC.tv/packages/multimedia/libudfread/package.mk
          grep '^PKG_URL=' LibreELEC.tv/packages/multimedia/libudfread/package.mk

          # freedesktop.org returns HTTP 418 to GitHub Actions for these two
          # pinned release archives. Gentoo mirrors carry the same files; the
          # LibreELEC SHA256 values remain unchanged and are verified by preflight.
          sed -i \
            's#http://www.freedesktop.org/software/pulseaudio/releases/${PKG_NAME}-${PKG_VERSION}.tar.xz#https://na.edge.kernel.org/gentoo/distfiles/62/${PKG_NAME}-${PKG_VERSION}.tar.xz#' \
            LibreELEC.tv/packages/audio/pulseaudio/package.mk
          grep '^PKG_URL=' LibreELEC.tv/packages/audio/pulseaudio/package.mk

          sed -i \
            's#http://www.freedesktop.org/software/libevdev/${PKG_NAME}-${PKG_VERSION}.tar.xz#https://mirrors.xmission.com/gentoo/distfiles/d4/${PKG_NAME}-${PKG_VERSION}.tar.xz#' \
            LibreELEC.tv/packages/sysutils/libevdev/package.mk

          sed -i \
            's#http://linuxtv.org/downloads/v4l-utils/${PKG_NAME}-${PKG_VERSION}.tar.xz#https://archive.ubuntu.com/ubuntu/pool/main/v/v4l-utils/v4l-utils_${PKG_VERSION}.orig.tar.xz#' \
            LibreELEC.tv/packages/sysutils/v4l-utils/package.mk
          grep '^PKG_URL=' LibreELEC.tv/packages/sysutils/libevdev/package.mk

          # The old alpharde/udevil repository is gone. The exact pinned commit
          # still exists in Arnie97/udevil-ng. Use GitHub's archive for that exact
          # commit. The archive bytes differ because the repository name differs,
          # so calculate that archive SHA before LibreELEC's preflight verifies it.
          sed -i \
            's#https://github.com/alpharde/udevil/archive/${PKG_VERSION}.tar.gz#https://github.com/Arnie97/udevil-ng/archive/${PKG_VERSION}.tar.gz#' \
            LibreELEC.tv/packages/sysutils/udevil/package.mk
          udevil_version="$(sed -n 's/^PKG_VERSION="\([^"]*\)"/\1/p' LibreELEC.tv/packages/sysutils/udevil/package.mk)"
          udevil_url="https://github.com/Arnie97/udevil-ng/archive/${udevil_version}.tar.gz"
          udevil_tmp="$(mktemp)"
          wget -q --timeout=30 --tries=3 -O "$udevil_tmp" "$udevil_url"
          udevil_sha="$(sha256sum "$udevil_tmp" | awk '{print $1}')"
          rm -f "$udevil_tmp"
          sed -i "s/^PKG_SHA256=.*/PKG_SHA256=\"$udevil_sha\"/" \
            LibreELEC.tv/packages/sysutils/udevil/package.mk
          grep '^PKG_URL=' LibreELEC.tv/packages/sysutils/udevil/package.mk
          grep '^PKG_SHA256=' LibreELEC.tv/packages/sysutils/udevil/package.mk

          # LibreELEC 12.2.1 builds host tools with -march=native. That is not
          # safe when ccache is restored on a different GitHub runner CPU:
          # cached host objects may contain instructions unsupported by the next
          # runner and crash with "Illegal instruction". Keep target flags
          # untouched; make only host tools portable across x86_64 runners.
          sed -i \
            's/^HOST_CFLAGS="-march=native /HOST_CFLAGS="-march=x86-64 /' \
            LibreELEC.tv/config/optimize
          grep '^HOST_CFLAGS=' LibreELEC.tv/config/optimize

          sed -i 's/^CCACHE_CACHE_SIZE=.*/CCACHE_CACHE_SIZE="5G"/' \
            LibreELEC.tv/config/options

      - name: Cache LibreELEC source archives
        uses: actions/cache@v4
        with:
          path: LibreELEC.tv/sources
          key: libreelec-12.2.1-generic-x86_64-sources-v1
          restore-keys: |
            libreelec-12.2.1-generic-x86_64-sources-

      - name: Preflight all LibreELEC source downloads
        timeout-minutes: 45
        working-directory: LibreELEC.tv
        shell: bash
        run: |
          set -euo pipefail
          PLAN="${RUNNER_TEMP}/libreelec-image-plan.json"
          PKGS="${RUNNER_TEMP}/libreelec-image-packages.txt"

          ./scripts/pkgjson | ./scripts/genbuildplan.py \
            --with-json "$PLAN" --build image >/dev/null

          python3 - "$PLAN" > "$PKGS" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              plan = json.load(f)

          seen = set()
          for step in plan:
              package = step["name"].split(":", 1)[0]
              if package not in seen:
                  seen.add(package)
                  print(package)
          PY

          echo "Preflight source packages: $(wc -l < "$PKGS")"

          failures=()
          while IFS= read -r package; do
            if ! ./scripts/get "$package"; then
              failures+=("$package")
            fi
          done < "$PKGS"

          if ((${#failures[@]})); then
            printf 'Source preflight failed for %d package(s):\n' "${#failures[@]}" >&2
            printf '  %s\n' "${failures[@]}" >&2
            exit 1
          fi

      - name: Restore LibreELEC compiler cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .libreelec-ccache
            .libreelec-ccache-local
          key: libreelec-12.2.1-generic-x86_64-ccache-restore-${{ github.run_id }}
          restore-keys: |
            libreelec-12.2.1-generic-x86_64-ccache-v2-
            libreelec-12.2.1-generic-x86_64-ccache-v1-bootstrap-

      - name: Generate Kodi JJS functional patch
        shell: bash
        run: |
          set -euxo pipefail
          git init kodi-jjs
          git -C kodi-jjs remote add origin "${KODI_REPO}"
          git -C kodi-jjs fetch --depth=1 origin "${KODI_BASE}"
          git -C kodi-jjs fetch --depth=1 origin "${KODI_JJS}"

          PATCH="$GITHUB_WORKSPACE/kodi-jjs-gapless-libreelec.patch"

          git -C kodi-jjs diff --binary --no-ext-diff "${KODI_BASE}" "${KODI_JJS}" -- \
            xbmc/application/ApplicationPlayer.cpp \
            xbmc/cores/AudioEngine/Engines/ActiveAE/ActiveAESink.cpp \
            xbmc/cores/AudioEngine/Sinks/AESinkALSA.cpp \
            xbmc/cores/AudioEngine/Utils/PackerMAT.cpp \
            xbmc/cores/AudioEngine/Utils/PackerMAT.h \
            xbmc/cores/VideoPlayer/DVDCodecs/Audio/DVDAudioCodecPassthrough.cpp \
            xbmc/cores/VideoPlayer/DVDCodecs/Audio/DVDAudioCodecPassthrough.h \
            xbmc/cores/paplayer/AudioDecoder.cpp \
            xbmc/cores/paplayer/AudioDecoder.h \
            xbmc/cores/paplayer/ICodec.h \
            xbmc/cores/paplayer/PAPlayer.cpp \
            xbmc/cores/paplayer/PAPlayer.h \
            xbmc/cores/paplayer/VideoPlayerCodec.cpp \
            xbmc/cores/paplayer/VideoPlayerCodec.h \
            > "$PATCH"

          test -s "$PATCH"
          ! grep -q 'TRUEHDTRACE' "$PATCH"
          ! grep -q 'README.JJS' "$PATCH"
          ! grep -q 'tools/android/packaging' "$PATCH"
          cp "$PATCH" LibreELEC.tv/packages/mediacenter/kodi/patches/kodi-999.90-jjs-gapless.patch

          # Keep Kodi's internal APP_NAME and LibreELEC package identity untouched.
          # Only expose the numbered JJS tag plus "Kodi JJS" in System Information.
          ID_BASE="$GITHUB_WORKSPACE/version-libreelec-base.txt"
          ID_JJS="$GITHUB_WORKSPACE/version-libreelec-jjs.txt"
          ID_PATCH="$GITHUB_WORKSPACE/kodi-jjs-identity-libreelec.patch"
          git -C kodi-jjs show "${KODI_BASE}:version.txt" > "$ID_BASE"
          cp "$ID_BASE" "$ID_JJS"
          sed -i -e 's/^VERSION_TAG.*/VERSION_TAG JJS.003/' "$ID_JJS"
          diff -u --label a/version.txt --label b/version.txt "$ID_BASE" "$ID_JJS" > "$ID_PATCH" || test $? -eq 1
          git -C kodi-jjs diff --binary --no-ext-diff "${KODI_BASE}" "${KODI_JJS}" -- \
            xbmc/windows/GUIWindowSystemInfo.cpp >> "$ID_PATCH"
          test -s "$ID_PATCH"
          cp "$ID_PATCH" LibreELEC.tv/packages/mediacenter/kodi/patches/kodi-999.91-jjs-identity.patch

          echo "Patch statistics:"
          git -C kodi-jjs diff --stat "${KODI_BASE}" "${KODI_JJS}" -- \
            xbmc/application/ApplicationPlayer.cpp \
            xbmc/cores/AudioEngine/Utils/PackerMAT.cpp \
            xbmc/cores/AudioEngine/Utils/PackerMAT.h \
            xbmc/cores/VideoPlayer/DVDCodecs/Audio/DVDAudioCodecPassthrough.cpp \
            xbmc/cores/VideoPlayer/DVDCodecs/Audio/DVDAudioCodecPassthrough.h \
            xbmc/cores/paplayer/AudioDecoder.cpp \
            xbmc/cores/paplayer/AudioDecoder.h \
            xbmc/cores/paplayer/ICodec.h \
            xbmc/cores/paplayer/PAPlayer.cpp \
            xbmc/cores/paplayer/PAPlayer.h \
            xbmc/cores/paplayer/VideoPlayerCodec.cpp \
            xbmc/cores/paplayer/VideoPlayerCodec.h

      - name: Mark image as JJS build
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/LIBREELEC_VERSION="devel"/LIBREELEC_VERSION="12.2.1-JJS.003-Test"/' \
            LibreELEC.tv/distributions/LibreELEC/version
          grep LIBREELEC_VERSION LibreELEC.tv/distributions/LibreELEC/version

      - name: Verify LibreELEC build host
        working-directory: LibreELEC.tv
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/checkdeps
          df -h /

      - name: Build Generic x86_64 update image
        id: build_image
        working-directory: LibreELEC.tv
        shell: bash
        run: |
          set +e
          timeout --verbose --signal=INT --kill-after=120s 285m \
            bash -o pipefail -c 'make image 2>&1 | tee "${GITHUB_WORKSPACE}/libreelec-build.log"'
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "LibreELEC build stopped with rc=${rc}; ccache will be preserved."
          fi
          sync
          exit 0

      - name: Save updated LibreELEC compiler cache
        uses: actions/cache/save@v4
        with:
          path: |
            .libreelec-ccache
            .libreelec-ccache-local
          key: libreelec-12.2.1-generic-x86_64-ccache-v2-${{ github.run_id }}

      - name: Show build outputs
        if: always()
        shell: bash
        run: |
          set -x
          df -h /
          find LibreELEC.tv/target -maxdepth 1 -type f -printf '%f  %s bytes\n' 2>/dev/null | sort || true

      - name: Prepare LibreELEC build diagnostics
        if: steps.build_image.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tail -n 1000 libreelec-build.log > libreelec-build-tail.log

      - name: Upload LibreELEC build diagnostics
        if: steps.build_image.outputs.complete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LibreELEC-JJS.003-build-diagnostics
          path: libreelec-build-tail.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload LibreELEC update image
        if: steps.build_image.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LibreELEC-Generic-x86_64-12.2.1-JJS.003-Test
          if-no-files-found: error
          retention-days: 14
          path: |
            LibreELEC.tv/target/*.tar
            LibreELEC.tv/target/*.img.gz
            LibreELEC.tv/target/*.sha256
            kodi-jjs-gapless-libreelec.patch
            kodi-jjs-identity-libreelec.patch

      - name: Fail after preserving cache if image is incomplete
        if: steps.build_image.outputs.complete != 'true'
        shell: bash
        run: |
          echo "LibreELEC did not finish inside the safe build window."
          echo "The updated ccache has been saved; rerun the workflow to continue with a warmer cache."
          exit 1
